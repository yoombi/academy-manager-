<style>
/* 엄마다했쏙 — 모바일 퍼스트 스타일 */
:root {
  --bg: #f4f5fa;
  --surface: #ffffff;
  --surface-2: #f7f8fc;
  --line: #e6e8f1;
  --text: #191b27;
  --text-2: #4b5162;
  --muted: #8a90a2;
  --accent: #4f46e5;
  --accent-2: #6366f1;
  --accent-soft: #eef0ff;
  --danger: #e11d48;
  --danger-soft: #ffe9ee;
  --ok: #16a34a;
  --warn: #d97706;
  --warn-soft: #fff4e0;
  --today-soft: #fff1f0;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 10px 24px -12px rgba(20, 24, 40, .14);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1017;
    --surface: #171a24;
    --surface-2: #1e222e;
    --line: #2a2f3d;
    --text: #eef0f7;
    --text-2: #c3c8d6;
    --muted: #8b93a7;
    --accent: #818cf8;
    --accent-2: #6366f1;
    --accent-soft: #232544;
    --danger: #fb7185;
    --danger-soft: #3a1b25;
    --warn: #fbbf24;
    --warn-soft: #3a2c14;
    --today-soft: #34201f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 28px -14px rgba(0, 0, 0, .6);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
    "Noto Sans KR", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

body.sheet-open { overflow: hidden; }

button { font-family: inherit; font-size: inherit; color: inherit; }
ul, ol { margin: 0; padding: 0; list-style: none; }
h1, h2, h3, p { margin: 0; }

/* ---------- 상단 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid transparent;
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar::after {
  content: "";
  display: block;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
}
.topbar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px 6px;
  max-width: 620px;
  margin: 0 auto;
}
.brand-text { flex: 1; min-width: 0; }
.brand-text h1 {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -.02em;
}
.today-line {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.icon-btn {
  border: 0;
  background: var(--surface);
  width: 38px;
  height: 38px;
  border-radius: 12px;
  font-size: 17px;
  display: grid;
  place-items: center;
  box-shadow: var(--shadow);
  cursor: pointer;
}

/* ---------- 아이 칩 ---------- */
.kidbar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 6px 16px 12px;
  max-width: 620px;
  margin: 0 auto;
  scrollbar-width: none;
}
.kidbar::-webkit-scrollbar { display: none; }
.kidchip {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-2);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: transform .12s ease, background .15s ease;
}
.kidchip:active { transform: scale(.96); }
.kidchip.on {
  background: var(--c, var(--accent));
  border-color: transparent;
  color: #fff;
  box-shadow: 0 6px 14px -8px var(--c, var(--accent));
}
.kidchip-emoji { font-size: 14px; }
.kidchip-add {
  font-weight: 700;
  color: var(--muted);
  padding: 7px 12px;
}

/* ---------- 본문 ---------- */
.main {
  max-width: 620px;
  margin: 0 auto;
  padding: 4px 16px calc(96px + var(--safe-b));
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  border: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
}
.card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.card-head h2 {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -.01em;
  flex: 1;
}
.card-count {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}
.card-desc {
  font-size: 13px;
  color: var(--text-2);
  margin-bottom: 12px;
  line-height: 1.55;
}
.card-desc.muted { color: var(--muted); font-size: 12.5px; margin-top: 10px; margin-bottom: 0; }
.empty {
  font-size: 13.5px;
  color: var(--muted);
  padding: 10px 2px 6px;
  line-height: 1.55;
}
.footnote {
  text-align: center;
  font-size: 11.5px;
  color: var(--muted);
  padding: 4px 0 8px;
}

/* ---------- 버튼 ---------- */
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  padding: 9px 14px;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: transform .12s ease, filter .15s ease;
}
.btn:active { transform: scale(.97); }
.btn.primary {
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  border-color: transparent;
  color: #fff;
  box-shadow: 0 8px 18px -10px var(--accent);
}
.btn.ghost { background: var(--surface-2); color: var(--text-2); }
.btn.danger { color: var(--danger); }
.btn.tiny { padding: 6px 10px; font-size: 12.5px; border-radius: 10px; }
.btn.block { display: block; width: 100%; padding: 12px; font-size: 14.5px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 0; min-width: 96px; }

/* ---------- 히어로 (다음 수업) ---------- */
.hero {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--c) 22%, transparent) 0%, transparent 60%),
    var(--surface);
  border: 1px solid color-mix(in srgb, var(--c) 26%, var(--line));
}
.hero-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.hero-eyebrow {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .04em;
  color: var(--c);
  text-transform: uppercase;
}
.hero-when { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.hero-name {
  font-size: 24px;
  font-weight: 850;
  letter-spacing: -.03em;
  margin: 8px 0 6px;
  line-height: 1.2;
}
.hero-sub {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 13.5px;
  color: var(--text-2);
}
.hero-remain {
  font-weight: 800;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 12%, transparent);
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 12.5px;
}
.hero-place { margin-top: 8px; font-size: 13px; color: var(--text-2); }
.hero-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
}
.hero-memo {
  font-size: 12.5px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hero-empty { background: var(--surface); }

/* ---------- 오늘의 학원 행 ---------- */
.list { display: flex; flex-direction: column; }
.list > li + li { border-top: 1px solid var(--line); }
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  border: 0;
  background: none;
  padding: 11px 2px;
  text-align: left;
  cursor: pointer;
}
.row-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--c, var(--accent));
  flex: 0 0 auto;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--c, var(--accent)) 16%, transparent);
}
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title {
  font-size: 14.5px;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row-sub { font-size: 12.5px; color: var(--muted); }
.row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.row-kid { display: flex; }

.pill {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-2);
  background: var(--surface-2);
  border-radius: 999px;
  padding: 3px 9px;
  white-space: nowrap;
}
.pill-live { color: var(--accent); background: var(--accent-soft); }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--c, var(--text-2));
  background: color-mix(in srgb, var(--c, var(--muted)) 13%, transparent);
  border-radius: 999px;
  padding: 2px 8px;
  white-space: nowrap;
}
.tag-emoji { font-size: 11px; }
.tag-plain {
  color: var(--muted);
  background: var(--surface-2);
}

/* ---------- 숙제 ---------- */
.hwl { display: flex; flex-direction: column; }
.hwl > li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 2px;
}
.hwl > li + li { border-top: 1px solid var(--line); }
.check {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  border-radius: 9px;
  border: 1.8px solid var(--line);
  background: var(--surface);
  color: #fff;
  font-size: 14px;
  font-weight: 800;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform .12s ease, background .15s ease, border-color .15s ease;
}
.check:active { transform: scale(.9); }
.check.on {
  background: var(--ok);
  border-color: var(--ok);
}
.hw-body {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  text-align: left;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
}
.hw-title { font-size: 14.5px; font-weight: 650; line-height: 1.35; word-break: break-word; }
.is-done .hw-title { color: var(--muted); text-decoration: line-through; }
.hw-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.hw-memo {
  font-size: 12px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 150px;
}
.due {
  flex: 0 0 auto;
  font-size: 11.5px;
  font-weight: 800;
  padding: 4px 8px;
  border-radius: 8px;
  white-space: nowrap;
}
.due--late { color: var(--danger); background: var(--danger-soft); }
.due--today { color: #fff; background: var(--danger); }
.due--soon { color: var(--warn); background: var(--warn-soft); }
.due--later, .due--none { color: var(--muted); background: var(--surface-2); }
.is-done .due { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }

.kid-block { padding-top: 10px; }
.kid-block + .kid-block { border-top: 1px solid var(--line); margin-top: 10px; }
.kid-block-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
.kid-block .hwl > li { padding: 8px 2px; }
.prog {
  height: 5px;
  border-radius: 999px;
  background: var(--surface-2);
  overflow: hidden;
  margin-bottom: 4px;
}
.prog > span {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--c, var(--accent));
  transition: width .25s ease;
}
.prog-text { font-size: 12px; font-weight: 800; color: var(--text-2); }
.empty.small { font-size: 12.5px; padding: 8px 2px; }
.rt-time {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-2);
  background: var(--surface-2);
  padding: 2px 7px;
  border-radius: 7px;
}
.hwl .btn.block { margin-top: 8px; }
.hint-line { font-size: 11.5px; color: var(--muted); margin: -4px 0 10px; line-height: 1.5; }
.banner {
  background: var(--danger-soft);
  color: var(--danger);
  font-size: 13px;
  font-weight: 700;
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  margin-bottom: 8px;
}

/* ---------- 필터 ---------- */
.filters { display: flex; gap: 7px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text-2);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12.5px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.fchip.on { background: var(--accent); border-color: transparent; color: #fff; }

/* ---------- 주간 시간표 ---------- */
.week { display: flex; flex-direction: column; }
.wrow {
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 10px;
  padding: 8px 0;
  align-items: start;
}
.wrow + .wrow { border-top: 1px dashed var(--line); }
.wrow.is-today { background: color-mix(in srgb, var(--accent) 6%, transparent); border-radius: 10px; }
.wday {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding-top: 2px;
}
.wday b { font-size: 13px; font-weight: 800; }
.wrow.is-today .wday b { color: var(--accent); }
.wday span { font-size: 10.5px; color: var(--muted); }
.witems { display: flex; flex-direction: column; gap: 6px; min-height: 24px; justify-content: center; }
.wempty { color: var(--muted); font-size: 12.5px; }
.chip-class {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid color-mix(in srgb, var(--c) 28%, var(--line));
  background: color-mix(in srgb, var(--c) 8%, var(--surface));
  border-radius: 11px;
  padding: 7px 10px;
  text-align: left;
  cursor: pointer;
  border-left: 3px solid var(--c);
}
.chip-name {
  font-size: 13.5px;
  font-weight: 750;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chip-time { font-size: 11.5px; color: var(--text-2); font-weight: 600; white-space: nowrap; }

/* ---------- 학원 관리 목록 ---------- */
.mng { display: flex; align-items: center; gap: 10px; padding: 11px 2px; }
.mng-main { flex: 1; min-width: 0; }
.mng-title { font-size: 14.5px; font-weight: 700; }
.mng-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.mng-tags { margin-top: 5px; display: flex; gap: 4px; flex-wrap: wrap; }
.mng-list > li + li { border-top: 1px solid var(--line); }

/* ---------- 온보딩 ---------- */
.intro { text-align: center; padding: 24px 18px; }
.intro-emoji { font-size: 40px; line-height: 1; }
.intro h2 { font-size: 19px; font-weight: 850; margin: 12px 0 8px; letter-spacing: -.02em; }
.intro p { font-size: 13.5px; color: var(--text-2); line-height: 1.6; }
.steps {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 18px 0;
  text-align: left;
}
.steps li {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 13.5px;
  color: var(--text-2);
}
.steps b {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
}
.steps.small li { padding: 8px 11px; font-size: 13px; }
.intro-actions { display: flex; flex-direction: column; gap: 8px; }
.notice h2 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
.notice p { font-size: 13.5px; color: var(--text-2); line-height: 1.55; margin-bottom: 12px; }

/* ---------- 설정 ---------- */
.setting {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 0;
  border-top: 1px solid var(--line);
}
.setting:first-of-type { border-top: 0; }
.setting-label { flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-note {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.55;
  padding: 6px 0 10px;
}
.switch {
  width: 46px;
  height: 28px;
  border-radius: 999px;
  border: 0;
  background: var(--line);
  padding: 3px;
  cursor: pointer;
  transition: background .18s ease;
  flex: 0 0 auto;
}
.switch span {
  display: block;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
  transition: transform .18s ease;
}
.switch.on { background: var(--accent); }
.switch.on span { transform: translateX(18px); }
.select, .input-time {
  flex: 0 0 auto;
  max-width: 58%;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text);
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 13.5px;
  font-weight: 600;
}

/* ---------- 시트 ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.backdrop {
  position: absolute;
  inset: 0;
  background: rgba(12, 14, 22, .45);
  backdrop-filter: blur(2px);
  animation: fade .18s ease;
}
.sheet {
  position: relative;
  width: 100%;
  max-width: 620px;
  max-height: 90vh;
  overflow-y: auto;
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  padding: 8px 18px calc(18px + var(--safe-b));
  box-shadow: 0 -18px 40px -20px rgba(0, 0, 0, .4);
  animation: rise .22s cubic-bezier(.2, .8, .3, 1);
}
.handle {
  width: 38px;
  height: 4px;
  border-radius: 999px;
  background: var(--line);
  margin: 4px auto 10px;
}
.sheet-title { font-size: 17px; font-weight: 850; letter-spacing: -.02em; margin-bottom: 14px; }
.field { display: block; margin-bottom: 13px; }
.field-label {
  display: block;
  font-size: 12.5px;
  font-weight: 750;
  color: var(--text-2);
  margin-bottom: 6px;
}
.field-label .hint { font-weight: 500; color: var(--muted); font-size: 11.5px; margin-left: 4px; }
.input {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text);
  border-radius: var(--radius-sm);
  padding: 11px 12px;
  font-size: 15px;
  font-family: inherit;
  font-weight: 600;
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
  -webkit-appearance: none;
  appearance: none;
}
select.input {
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 34px;
}
textarea.input { resize: vertical; line-height: 1.5; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.field-2 { display: flex; gap: 10px; }
.field-2 .sub { flex: 1; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text-2);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  min-width: 42px;
  text-align: center;
}
.chip.on {
  background: var(--accent);
  border-color: transparent;
  color: #fff;
}
.chips [data-pickgroup="color"] {
  min-width: 34px;
  height: 34px;
  padding: 0;
  border-radius: 50%;
  background: var(--c);
  border: 2px solid transparent;
  box-shadow: inset 0 0 0 2px var(--surface);
}
.chips [data-pickgroup="color"].on {
  border-color: var(--c);
  box-shadow: inset 0 0 0 3px var(--surface), 0 0 0 2px color-mix(in srgb, var(--c) 35%, transparent);
}
.form-err {
  display: none;
  color: var(--danger);
  background: var(--danger-soft);
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 10px;
}
.form-err.show { display: block; }
.sheet-actions {
  display: flex;
  gap: 8px;
  margin-top: 6px;
}
.sheet-actions .btn { flex: 1; padding: 12px; }
.sheet-actions .btn.primary { flex: 1.5; }

@keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* ---------- 하단 탭 ---------- */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  display: flex;
  max-width: 620px;
  margin: 0 auto;
  padding: 6px 10px calc(6px + var(--safe-b));
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.tab {
  flex: 1;
  border: 0;
  background: none;
  padding: 6px 0 4px;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: var(--muted);
  cursor: pointer;
  position: relative;
}
.tab.on { color: var(--accent); }
.tab-icon { font-size: 18px; line-height: 1; filter: grayscale(1) opacity(.65); }
.tab.on .tab-icon { filter: none; }
.tab-label { font-size: 11px; font-weight: 750; }
.tab-badge {
  position: absolute;
  top: 0;
  right: calc(50% - 22px);
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--danger);
  color: #fff;
  font-size: 10.5px;
  font-weight: 800;
  display: grid;
  place-items: center;
}

/* ---------- 토스트 ---------- */
.toast-root {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(96px + var(--safe-b));
  z-index: 70;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
}
.toast {
  background: rgba(24, 26, 38, .94);
  color: #fff;
  border-radius: 999px;
  padding: 10px 18px;
  font-size: 13.5px;
  font-weight: 600;
  max-width: 86%;
  text-align: center;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .22s ease, transform .22s ease;
}
.toast.show { opacity: 1; transform: none; }

/* ---------- 관리자(엄마) 잠금 ---------- */
.icon-btn[hidden] { display: none; }
#lockBtn { font-size: 15px; }
.lock-card .card-desc { margin-bottom: 4px; }
.lock-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.lock-actions .btn-row { width: 100%; }
.sheet-fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.sheet-fieldset[disabled] .input { opacity: .72; }
.locked-note { color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 9px 12px; margin: 0 0 10px; }
.lock-gate .intro-actions { gap: 8px; }

/* 비밀번호 입력 시트 */
.pin-sheet { max-width: 420px; }
.pin-dots { display: flex; gap: 14px; justify-content: center; margin: 6px 0 14px; }
.pin-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 2px solid var(--line);
  background: var(--surface-2);
  transition: background .15s ease, border-color .15s ease, transform .15s ease;
}
.pin-dot.on { background: var(--accent); border-color: var(--accent); transform: scale(1.08); }
.pin-err, .pin-wait { display: none; font-size: 13px; font-weight: 700; border-radius: 10px; padding: 9px 12px; margin: 0 0 10px; }
.pin-err.show { display: block; color: var(--danger); background: var(--danger-soft); }
.pin-wait.show { display: block; color: var(--warn); background: var(--warn-soft); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 12px; }
.pin-key {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text);
  border-radius: 14px;
  padding: 14px 0;
  font-size: 21px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
}
.pin-key:active { transform: scale(.97); background: var(--accent-soft); }
.pin-key-fn { font-size: 18px; color: var(--text-2); }
.pin-key-blank { border: 0; background: none; pointer-events: none; }
.pin-sheet .sheet-actions .btn { flex: 1; }
.pin-help {
  margin-top: 12px;
  padding: 12px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  font-size: 12.5px;
  color: var(--text-2);
  line-height: 1.55;
}
.pin-help p { margin: 0 0 10px; }

/* ---------- 캘린더(.ics) 불러오기 ---------- */
.ics-import-card .card-desc { margin-bottom: 10px; }
.ics-sheet { max-width: 560px; }
.ics-sheet .card-desc { margin-bottom: 4px; }
.ics-sheet .row-note { padding: 4px 0 10px; }
.ics-guide {
  margin: 2px 0 12px;
  padding: 9px 12px;
  border-radius: 10px;
  background: var(--surface-2);
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--muted);
}
.ics-guide b { color: var(--text-2); font-size: 11.5px; font-weight: 750; }
.ics-list-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 4px 0 8px;

.ics-list-head b { font-size: 13px; font-weight: 800; color: var(--text-2); }

/* ---------- 한눈에 보기 (주간 표) ---------- */
body.grid-open { overflow: hidden; }

}

}

}

  align-items: center;

}

.seg {
  display: flex;
  gap: 3px;

  border: 1px solid var(--line);

}

  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 10px;
  border: 0;
  border-radius: 8px;

  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-2);

}

.grid-body {
  flex: 1 1 auto;

  overflow: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 12px calc(24px + var(--safe-b));
}
.grid-blocks {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 500px), 1fr));
  gap: 12px;
  align-items: start;
  max-width: 1480px;
  margin: 0 auto;
}
.grid-notice { max-width: 480px; margin: 0 auto; }

.tt-block {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);

}

  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 2px 8px;
}
.tt-count { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-left: auto; }

.tt-scroll {

/* 시간표 격자 — 폰 폭(360~430px)에서도 월~일이 한눈에 들어오는 압축 표 */
.tt-scroll {

.tt-corner { min-height: 34px; letter-spacing: -.03em; }

.tt-hours {

}

.tt-hour b {

.grid-overlay.is-zoom-big .tt-hour { padding-top: 3px; }

.grid-overlay.is-zoom-big .tt-hour span { display: block; }

/* 시간대 경계 가로선 + 짝수 시간대 옅은 띠 (선을 먼저 그려 위에 오게) */
.tt-cols {
  position: relative;
  height: calc(var(--rows) * var(--row-h));
  background-color: var(--surface);
  background-image:

}
.tt-col {
  position: relative;
  min-width: 0;
  border-left: 1px solid var(--tt-line);
  /* 색을 칠한 칸(오늘·주말)에서도 시간대 가로선이 지워지지 않게 같은 선을 한 번 더 */
  background-image: repeating-linear-gradient(to bottom, var(--tt-line) 0 1px, transparent 1px var(--row-h));

.tt-col.is-weekend { background: color-mix(in srgb, #94a3b8 7%, transparent); }
.tt-col.is-today { background: color-mix(in srgb, var(--accent) 8%, transparent); }

.tt-ev {
  position: absolute;

  margin: 0;
  padding: 1px 1px 1px 2px;
  border-radius: 7px;

  border-left: 2px solid hsl(var(--h), 58%, 58%);
  background: hsl(var(--h), 76%, 96%);

  text-align: left;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(20, 24, 40, .10);
  line-height: 1.15;
}
/* 월~일 7칸이 다 들어오는 좁은 화면에서는 글자를 한 단계만 줄여 이름이 한 줄에 들어가게 */
.tt.is-dense .tt-ev-name { font-size: 9.5px; letter-spacing: -.05em; }
.tt.is-dense .tt-ev-time { font-size: 8px; }
.tt-ev:active { filter: brightness(.96); }
.tt-ev-name {
  font-size: 10px;
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -.05em;
  word-break: normal;

.tt-ev-time {
  display: flex;
  flex-wrap: wrap;
  margin-top: 1px;
  font-size: 8.5px;
  font-weight: 700;

  letter-spacing: -.02em;

.tt-ev-time > span { white-space: nowrap; }
.tt-ev.is-compact .tt-ev-time { display: none; }

.grid-overlay.is-zoom-big .tt-ev { padding: 3px 4px 3px 5px; border-radius: 8px; border-left-width: 3px; }
.grid-overlay.is-zoom-big .tt-ev-name { font-size: 12px; -webkit-line-clamp: 3; }
.grid-overlay.is-zoom-big .tt-ev-time { font-size: 10px; }

@media (max-width: 520px) {

@media (min-width: 700px) {

  .tt-ev-time { color: hsl(var(--h), 45%, 82%); }

  .tt-dayhead.is-sun { background: color-mix(in srgb, #ef4444 14%, var(--surface-2)); }
}

/* 인쇄·PDF: 표만 크게, 배경은 종이에 어울리게 */
@media print {
  @page { size: A4 landscape; margin: 8mm; }
  html, body { background: #fff !important; }
  body > *:not(#gridRoot) { display: none !important; }

}

  .hero-name { font-size: 26px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

<script>
/* 엄마다했쏙 — 공용 로직 (DOM 없이 동작, node/테스트에서도 사용) */
(function (global) {
  'use strict';

  var DAY_LABELS = ['월', '화', '수', '목', '금', '토', '일'];
  var DAY_LONGS = ['월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'];
  var ICS_BYDAY = ['MO', 'TU', 'WE', 'TH', 'FR', 'SA', 'SU'];

  function pad2(n) { return String(n).padStart(2, '0'); }

  /* ---------- 날짜/시간 ---------- */

  function dateKey(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function parseDateKey(s) {
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s || ''));
    if (!m) return null;
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }

  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  /* 월=1 … 일=7 */
  function dayIndex(d) { return ((d.getDay() + 6) % 7) + 1; }
  function dayLabel(i) { return DAY_LABELS[i - 1] || ''; }
  function dayLong(i) { return DAY_LONGS[i - 1] || ''; }

  function hhmmToMinutes(s) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(s || ''));
    if (!m) return null;
    var h = Number(m[1]), mi = Number(m[2]);
    if (h > 24 || mi > 59) return null;
    return h * 60 + mi;
  }

  function minutesToHHMM(mins) {
    var m = ((Math.round(mins) % 1440) + 1440) % 1440;
    return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60);
  }

  function hhmmOf(date) { return pad2(date.getHours()) + ':' + pad2(date.getMinutes()); }

  /* "오후 4:30" */
  function clockText(hhmm) {
    var mins = hhmmToMinutes(hhmm);
    if (mins == null) return '';
    var h = Math.floor(mins / 60), m = mins % 60;
    var ampm = h < 12 ? '오전' : '오후';
    var hh = h % 12;
    if (hh === 0) hh = 12;
    return ampm + ' ' + hh + ':' + pad2(m);
  }

  function rangeText(a, b) {
    var s = clockText(a);
    if (!s) return '';
    var e = clockText(b);
    return e ? s + '–' + e : s;
  }

  function atTime(date, hhmm) {
    var mins = hhmmToMinutes(hhmm);
    if (mins == null) mins = 0;
    return new Date(date.getFullYear(), date.getMonth(), date.getDate(), Math.floor(mins / 60), mins % 60, 0, 0);
  }

  function diffDays(a, b) {
    return Math.round((startOfDay(a) - startOfDay(b)) / 86400000);
  }

  function monthDay(date) { return (date.getMonth() + 1) + '/' + date.getDate(); }

  function dateLongText(date) {
    return (date.getMonth() + 1) + '월 ' + date.getDate() + '일 ' + dayLong(dayIndex(date));
  }

  /* 이번 주 월요일 */
  function weekStart(date) {
    var idx = dayIndex(date);
    return new Date(date.getFullYear(), date.getMonth(), date.getDate() - (idx - 1));
  }

  function weekDates(date) {
    var start = weekStart(date);
    var out = [];
    for (var i = 0; i < 7; i++) out.push(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
    return out;
  }

  /* ---------- 수업 ---------- */

  function classOn(cls, date) {
    return (cls.days || []).indexOf(dayIndex(date)) >= 0;
  }

  /* 시간이 비어 있는 일정(도서관 등)은 종일(allDay)로 본다 */
  function classBounds(cls, date) {
    var base = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, 0, 0, 0);
    var startMin = hhmmToMinutes(cls.start);
    if (startMin == null) {
      return { allDay: true, start: base, end: new Date(base.getTime() + 86400000) };
    }
    var endMin = hhmmToMinutes(cls.end);
    if (endMin == null || endMin <= startMin) endMin = startMin + 60;
    return {
      allDay: false,
      start: new Date(base.getTime() + startMin * 60000),
      end: new Date(base.getTime() + endMin * 60000)

      if (!title) title = '학원';
      title = title.slice(0, 60);

      var rule = ev.rrule || null;
      var ruleDays = icsRuleDays(rule);
      var weekly = !!(rule && String(rule.FREQ || '') === 'WEEKLY');
      var recurring = weekly || ruleDays.length > 0;
      if (weekly && icsUntilPassed(rule, now)) { result.skippedPast += 1; return; }

      var when = new Date(st.y, st.mo - 1, st.d);
      if (!recurring && (when < earliest || when > latest)) { result.skippedPast += 1; return; }

      var days = ruleDays.length ? ruleDays : [icsWeekday(st.y, st.mo, st.d)];
      var allDay = !!st.allDay;
      var start = '', end = '';
      if (!allDay) {
        start = minutesToHHMM(st.minutes);
        var endMin = ev.end && !ev.end.allDay ? ev.end.minutes : null;
        if (endMin == null && ev.duration) {
          var dur = icsDurationMinutes(ev.duration);
          if (dur != null) endMin = st.minutes + dur;

        if (endMin == null || endMin <= st.minutes) endMin = st.minutes + 60;
        end = minutesToHHMM(endMin);
      }

      var place = String(ev.location || '').trim().slice(0, 40);
      var memo = String(ev.description || '').trim();
      /* 이 앱이 내보낸 DESCRIPTION(“아이 · 장소 · 메모”)을 원래대로 되살린다 */
      if (memo && kidHint) {
        var bits = memo.split(' · ');
        if (String(bits[0] || '').trim() === kidHint) {
          bits.shift();
          /* 장소는 LOCATION 에서 읽고, 설명에 같은 값이 한 번 더 있으면 지운다 */

      var key = [title, days.join(','), start, end, kidHint].join('|');
      if (seen[key]) { result.duplicates += 1; return; }
      seen[key] = true;

      if (items.length >= limit) { result.truncated += 1; return; }
      items.push({
        title: title,
        days: days,
        start: start,
        end: end,
        allDay: allDay,
        place: place,
        memo: memo,
        kidHint: kidHint,
        uid: String(ev.uid || ''),
        recurring: recurring,

    }

    lines.forEach(function (line) {
      if (!line) return;
      var p = icsLineParts(line);
      if (!p) return;
      var value = String(p.value || '').trim();
      var upper = value.toUpperCase();
      if (p.name === 'BEGIN') {
        if (upper === 'VEVENT') { cur = {}; inAlarm = 0; }
        else if (upper === 'VALARM' && cur) inAlarm += 1;
        return;
      }
      if (p.name === 'END') {
        if (upper === 'VALARM') { if (inAlarm > 0) inAlarm -= 1; return; }
        if (upper === 'VEVENT') { flush(); cur = null; inAlarm = 0; }
        return;
      }
      if (!cur || inAlarm) return; /* VALARM 의 SUMMARY·DESCRIPTION 은 일정 내용이 아니다 */
      if (p.name === 'SUMMARY') cur.summary = icsUnescape(p.value);
      else if (p.name === 'DESCRIPTION') cur.description = icsUnescape(p.value);
      else if (p.name === 'LOCATION') cur.location = icsUnescape(p.value);
      else if (p.name === 'DTSTART') cur.start = icsDateValue(p.value, p.params);
      else if (p.name === 'DTEND') cur.end = icsDateValue(p.value, p.params);
      else if (p.name === 'DURATION') cur.duration = value;
      else if (p.name === 'RRULE') cur.rrule = icsRule(p.value);
      else if (p.name === 'UID') cur.uid = value;
      else if (p.name === 'STATUS') cur.status = upper;
      else if (p.name === 'RECURRENCE-ID') cur.recurrenceId = value;

      if (a.recurring !== b.recurring) return a.recurring ? -1 : 1;
      if (a.recurring) {
        var da = a.days[0] || 0, db = b.days[0] || 0;
        if (da !== db) return da - db;
      } else if (a.date !== b.date) {
        return a.date < b.date ? -1 : 1;
      }

  /* 이미 있는 학원 일정과 겹치는 요일 찾기 (중복 건너뛰기용)

    (classes || []).forEach(function (c) {

      cluster.forEach(function (it) {

     classes: 학원 일정 배열
     opt: { days:[1..7] (없으면 주말 자동), hideWeekend:'auto'|'always'|'never', step:60 }

    var days = opt.days;

    var from = null, to = null;
    list.forEach(function (c) {
      var r = classMinutes(c);
      if (!r) return;
      if (from == null || r.start < from) from = r.start;
      if (to == null || r.end > to) to = r.end;
    });
    var rows = [], totalMinutes = 0;
    if (from != null) {
      var startRow = Math.floor(from / step) * step;
      var endRow = Math.ceil(to / step) * step;
      if (endRow <= startRow) endRow = startRow + step;
      endRow = Math.min(1440, endRow);

      from = startRow;
      to = endRow;

    /* 같은 표 안에서 색이 겹치지 않게: 이름별 색을 먼저 정하고, 이미 쓴 색이면 다음 색으로 미룬다 */
    var hueUsed = {}, hueByName = {};
    list.forEach(function (c) {
      var name = String(c.name || '');
      if (hueByName[name] != null) return;
      var h = gridHue(name), idx = GRID_HUES.indexOf(h), tries = 0;
      while (hueUsed[h] && hueUsed[h] !== name && tries < GRID_HUES.length) {
        idx = (idx + 1) % GRID_HUES.length;
        h = GRID_HUES[idx];
        tries += 1;
      }
      hueByName[name] = h;
      hueUsed[h] = name;
    });
    list.forEach(function (c) {
      var r = classMinutes(c);
      (c.days || []).forEach(function (day) {
        if (days.indexOf(day) < 0) return;
        if (!r) {
          allDay.push({ id: c.id, kidId: c.kidId || '', name: c.name, day: day, memo: c.memo || '', place: c.place || '' });
          return;
        }
        events.push({
          id: c.id,
          kidId: c.kidId || '',
          name: c.name,
          day: day,
          start: r.start,
          end: r.end,
          minutes: r.minutes,
          timeText: hhmmText(r.start) + '~' + hhmmText(r.end),
          compact: r.minutes < 50,

      from: from == null ? 0 : from,
      to: to == null ? 0 : to,

<script>
/* 엄마다했쏙 — 화면/상태 (모든 데이터는 localStorage 에 저장) */
(function () {
  'use strict';

  var L = window.AcademyLogic;
  var STORE_KEY = 'academy-manager:v1';
  var APP_VERSION = '1.5.1';

  var COLORS = ['#6366f1', '#ef4444', '#f97316', '#f59e0b', '#22c55e', '#14b8a6', '#0ea5e9', '#ec4899'];
  var EMOJIS = ['🦊', '🐰', '🐻', '🐼', '🐯', '🐶', '🐱', '🐨', '🦁', '🐥', '🐙', '🦄'];
  var TABS = [
    { id: 'today', label: '오늘', icon: '☀️' },
    { id: 'schedule', label: '시간표', icon: '🗓️' },
    { id: 'homework', label: '숙제', icon: '✅' },
    { id: 'settings', label: '설정', icon: '⚙️' }
  ];

  var state = {
    view: 'today',
    kid: 'all',
    hwFilter: 'open',
    data: null,
    sheet: null,
    dayKey: null,
    /* 한눈에 보기(주간 표) — 잠금과 무관한 보기 전용 화면 */
    grid: null,
    installEvent: null,
    swReg: null,
    /* 관리자 잠금: 해제 상태는 이번 화면(세션)에서만 유지되고 새로고침하면 다시 잠긴다 */
    unlocked: false,
    pinFails: 0,
    pinBlockUntil: 0,
    lastActivity: 0
  };

  /* ================= 저장 ================= */

  function defaultSettings() {
    return { notifyClass: true, classLeadMin: 30, notifyHomework: true, homeworkTime: '20:00', gridZoom: 'fit' };
  }

  /* 관리자(엄마) 잠금 설정 — PIN 평문은 저장하지 않고 salt + 해시만 둔다 */
  function blankLock() {
    return { hash: '', salt: '', autoLockMin: 5, updatedAt: null };
  }

  function normalizeLock(raw) {
    var lock = blankLock();
    if (!raw || typeof raw !== 'object') return lock;
    var hash = typeof raw.hash === 'string' ? raw.hash.trim().toLowerCase() : '';
    var salt = typeof raw.salt === 'string' ? raw.salt.trim() : '';
    /* 해시가 온전한 64자리 16진수일 때만 잠금으로 인정 (깨진 값이면 잠기지 않게) */
    if (/^[0-9a-f]{64}$/.test(hash) && salt) {
      lock.hash = hash;
      lock.salt = salt;
    }
    var mins = Number(raw.autoLockMin);
    if ([1, 5, 10, 30, 0].indexOf(mins) >= 0) lock.autoLockMin = mins;
    lock.updatedAt = typeof raw.updatedAt === 'string' ? raw.updatedAt : null;
    return lock;
  }

  function blankData() {
    return {
      version: 1,
      kids: [],
      classes: [],
      routines: [],
      homeworks: [],
      checks: {},
      settings: defaultSettings(),
      lock: blankLock(),
      fired: {},
      createdAt: new Date().toISOString()

  }

  function normalizeData(raw) {
    var d = Object.assign(blankData(), raw || {});
    d.kids = (Array.isArray(d.kids) ? d.kids : [])
      .filter(function (k) { return k && k.id && k.name; })
      .map(function (k) {
        return { id: String(k.id), name: String(k.name), color: k.color || COLORS[0], emoji: k.emoji || '🙂' };
      });
    d.classes = (Array.isArray(d.classes) ? d.classes : [])
      .filter(function (c) { return c && c.id && c.name; })
      .map(function (c) {
        return {
          id: String(c.id),
          kidId: c.kidId ? String(c.kidId) : '',
          name: String(c.name),
          days: (Array.isArray(c.days) ? c.days : []).map(Number).filter(function (n) { return n >= 1 && n <= 7; }),
          start: L.hhmmToMinutes(c.start) == null ? '' : c.start,
          end: c.end || '',
          place: c.place || '',
          memo: c.memo || ''
        };
      });
    d.routines = (Array.isArray(d.routines) ? d.routines : [])
      .filter(function (r) { return r && r.id && r.title; })
      .map(function (r) {
        return {
          id: String(r.id),
          kidId: r.kidId ? String(r.kidId) : '',
          title: String(r.title),
          days: (Array.isArray(r.days) ? r.days : []).map(Number).filter(function (n) { return n >= 1 && n <= 7; }),
          time: r.time || '',
          memo: r.memo || ''
        };
      });
    d.homeworks = (Array.isArray(d.homeworks) ? d.homeworks : [])
      .filter(function (h) { return h && h.id && h.title; })
      .map(function (h) {
        return {
          id: String(h.id),
          kidId: h.kidId ? String(h.kidId) : '',
          classId: h.classId ? String(h.classId) : '',
          title: String(h.title),
          due: h.due || '',
          memo: h.memo || '',
          done: !!h.done,
          doneAt: h.doneAt || null,
          createdAt: h.createdAt || new Date().toISOString()
        };
      });
    d.checks = raw && raw.checks && typeof raw.checks === 'object' ? raw.checks : {};
    d.settings = Object.assign(defaultSettings(), raw && raw.settings ? raw.settings : {});
    /* 예전 백업(lock 없음)도 그대로 열린다 — 잠금 없음으로 채운다 */
    d.lock = normalizeLock(raw && raw.lock);
    d.fired = raw && raw.fired && typeof raw.fired === 'object' ? raw.fired : {};
    return d;
  }

  function load() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      return normalizeData(JSON.parse(raw));
    } catch (e) {
      return null;
    }
  }

  function save() {
    try {
      window.localStorage.setItem(STORE_KEY, JSON.stringify(state.data));
      return true;
    } catch (e) {
      toast('저장 공간이 부족해 저장하지 못했어요.');
      return false;
    }
  }

  function uid(prefix) {
    return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  /* ================= 관리자(엄마) 잠금 ================= */

  function lockInfo() {
    if (!state.data || !state.data.lock) return blankLock();
    return state.data.lock;
  }

  function hasPin() { return !!lockInfo().hash; }

  /* 잠금이 걸려 있고 아직 풀지 않은 상태 = 수정·설정 불가 */
  function lockRequired() { return hasPin() && !state.unlocked; }

  function markActivity() { state.lastActivity = Date.now(); }

  function lockNow(silent) {
    if (!hasPin()) return false;
    state.unlocked = false;
    state.sheet = null;
    if (!silent) toast('관리자 잠금을 다시 걸었어요');
    return true;
  }

  function unlockSession() {
    state.unlocked = true;
    state.pinFails = 0;
    state.pinBlockUntil = 0;
    markActivity();
  }

  /* 비밀번호 설정·변경 (해시만 저장) */
  function setPin(pin, autoLockMin) {
    if (!L.isPinShape(pin)) return { ok: false, error: '4자리 숫자를 입력해 주세요.' };
    var salt = L.randomSalt();
    var mins = autoLockMin == null ? lockInfo().autoLockMin : Number(autoLockMin);
    if ([1, 5, 10, 30, 0].indexOf(mins) < 0) mins = 5;
    state.data.lock = {
      hash: L.pinHash(pin, salt),
      salt: salt,
      autoLockMin: mins,
      updatedAt: new Date().toISOString()
    };
    save();
    unlockSession();
    return { ok: true };
  }

  /* 비밀번호 삭제 = 잠금 끄기 (잠금이 풀린 상태에서만 가능) */
  function clearPin() {
    state.data.lock = Object.assign(blankLock(), { autoLockMin: lockInfo().autoLockMin });
    save();
    unlockSession();
    return { ok: true };
  }

  function setLockAutoMin(mins) {
    var m = Number(mins);
    if ([1, 5, 10, 30, 0].indexOf(m) < 0) return;
    state.data.lock = Object.assign(blankLock(), lockInfo(), { autoLockMin: m });
    save();
  }

  /* 입력한 PIN 확인. 5번 틀리면 30초 동안 막는다 */
  function verifyPin(pin) {
    var lock = lockInfo();
    if (!lock.hash) { unlockSession(); return true; }
    var now = Date.now();
    if (state.pinBlockUntil > now) return false;
    if (L.pinHash(String(pin == null ? '' : pin), lock.salt) === lock.hash) {
      unlockSession();
      return true;
    }
    state.pinFails += 1;
    if (state.pinFails >= 5) {
      state.pinFails = 0;
      state.pinBlockUntil = now + 30000;
    }
    return false;
  }

  /* 일정 시간 손을 대지 않으면 다시 잠근다 (0 이면 자동 잠금 없음) */
  function autoLockCheck() {
    if (!hasPin() || !state.unlocked) return false;
    var mins = Number(lockInfo().autoLockMin);
    if (!(mins > 0)) return false;
    if (Date.now() - state.lastActivity < mins * 60000) return false;
    state.unlocked = false;
    state.sheet = null;
    renderAll();
    toast('오랫동안 그대로 있어서 관리자 잠금을 다시 걸었어요');
    return true;
  }

  /* 잠금이 걸려 있으면 PIN 시트를 먼저 띄운다 */
  function guardEdit(run) {
    if (!lockRequired()) { run(); return true; }
    openPinSheet('unlock', run);
    return false;
  }

  /* 항목 보기: 잠긴 상태면 읽기 전용 시트로 */
  function openItemSheet(type, id) {
    state.sheet = { type: type, id: id || null, readOnly: lockRequired() };
    renderAll();
    if (state.sheet && !state.sheet.readOnly) {
      var input = document.querySelector('.sheet input, .sheet select');
      if (input && input.focus) setTimeout(function () { try { input.focus(); } catch (e) {} }, 80);
    }
  }

  /* ================= 조회 ================= */

  function kidById(id) {
    return state.data.kids.filter(function (k) { return k.id === id; })[0] || null;
  }
  function classById(id) {
    return state.data.classes.filter(function (c) { return c.id === id; })[0] || null;
  }
  function routineById(id) {
    return state.data.routines.filter(function (r) { return r.id === id; })[0] || null;
  }
  function homeworkById(id) {
    return state.data.homeworks.filter(function (h) { return h.id === id; })[0] || null;
  }

  function scopedClasses() {
    return state.data.classes.filter(function (c) { return state.kid === 'all' || c.kidId === state.kid; });
  }
  function scopedHomeworks() {
    return state.data.homeworks.filter(function (h) { return state.kid === 'all' || h.kidId === state.kid; });
  }
  function scopedRoutines() {
    return state.data.routines.filter(function (r) { return state.kid === 'all' || r.kidId === state.kid; });
  }
  function todayRoutines() {
    var idx = L.dayIndex(new Date());
    return scopedRoutines()
      .filter(function (r) { return (r.days || []).indexOf(idx) >= 0; })
      .sort(function (a, b) {
        var am = L.hhmmToMinutes(String(a.time || '').split('~')[0]);
        var bm = L.hhmmToMinutes(String(b.time || '').split('~')[0]);
        if (am == null && bm == null) return a.title.localeCompare(b.title, 'ko');
        if (am == null) return 1;
        if (bm == null) return -1;
        return am - bm;
      });
  }
  function routineKey(id, dateKey) { return id + '|' + dateKey; }
  function isRoutineDone(r, dateKey) { return !!state.data.checks[routineKey(r.id, dateKey)]; }
  function routineStats(list, dateKey) {
    var done = list.filter(function (r) { return isRoutineDone(r, dateKey); }).length;
    return { done: done, total: list.length, pct: list.length ? Math.round((done / list.length) * 100) : 0 };
  }
  function openRoutinesToday() {
    var key = L.dateKey(new Date());
    return todayRoutines().filter(function (r) { return !isRoutineDone(r, key); });
  }
  function openHomeworksDue() {
    var key = L.dateKey(new Date());
    return scopedHomeworks().filter(function (h) { return !h.done && h.due && h.due <= key; });
  }
  function todayOpenCount() {
    var key = L.dateKey(new Date());
    var rt = todayRoutines().filter(function (r) { return !isRoutineDone(r, key); }).length;
    return rt + openHomeworksDue().length;
  }

  /* ================= 데이터 조작 ================= */

  function upsertKid(input) {
    var name = String(input.name || '').trim();
    if (!name) return { ok: false, error: '아이 이름을 입력해 주세요.' };
    var kid = input.id ? kidById(input.id) : null;
    if (kid) {
      kid.name = name;
      if (input.color) kid.color = input.color;
      if (input.emoji) kid.emoji = input.emoji;
    } else {
      kid = {
        id: uid('kid'),
        name: name,
        color: input.color || COLORS[state.data.kids.length % COLORS.length],
        emoji: input.emoji || EMOJIS[state.data.kids.length % EMOJIS.length]
      };
      state.data.kids.push(kid);
    }
    save();
    return { ok: true, kid: kid };
  }

  function deleteKid(id) {
    state.data.kids = state.data.kids.filter(function (k) { return k.id !== id; });
    state.data.classes = state.data.classes.filter(function (c) { return c.kidId !== id; });
    state.data.routines = state.data.routines.filter(function (r) { return r.kidId !== id; });
    state.data.homeworks = state.data.homeworks.filter(function (h) { return h.kidId !== id; });
    if (state.kid === id) state.kid = 'all';
    save();
  }

  function upsertClass(input) {
    var name = String(input.name || '').trim();
    var days = (Array.isArray(input.days) ? input.days : [])
      .map(Number)
      .filter(function (n) { return n >= 1 && n <= 7; })
      .sort(function (a, b) { return a - b; });
    if (!name) return { ok: false, error: '학원 이름을 입력해 주세요.' };
    if (!days.length) return { ok: false, error: '요일을 하나 이상 선택해 주세요.' };
    if (!input.kidId || !kidById(input.kidId)) return { ok: false, error: '아이를 선택해 주세요.' };
    var start = L.hhmmToMinutes(input.start) == null ? '' : input.start;
    var end = '';
    if (start) {
      var startMin = L.hhmmToMinutes(start);
      var endMin = L.hhmmToMinutes(input.end);
      if (endMin != null && endMin <= startMin) return { ok: false, error: '종료 시간은 시작 시간보다 늦어야 해요.' };
      end = endMin != null ? L.minutesToHHMM(endMin) : L.minutesToHHMM(startMin + 60);
    }
    var payload = {
      kidId: input.kidId,
      name: name,
      days: days,
      start: start,
      end: end,
      place: String(input.place || '').trim(),
      memo: String(input.memo || '').trim()
    };
    var item = input.id ? classById(input.id) : null;
    if (item) Object.assign(item, payload);
    else {
      item = Object.assign({ id: uid('cls') }, payload);
      state.data.classes.push(item);
    }
    save();
    return { ok: true, item: item };
  }

  function deleteClass(id) {
    state.data.classes = state.data.classes.filter(function (c) { return c.id !== id; });
    state.data.homeworks.forEach(function (h) { if (h.classId === id) h.classId = ''; });
    save();
  }

  function upsertRoutine(input) {
    var title = String(input.title || '').trim();
    var days = (Array.isArray(input.days) ? input.days : [])
      .map(Number).filter(function (n) { return n >= 1 && n <= 7; })
      .sort(function (a, b) { return a - b; });
    if (!title) return { ok: false, error: '할 일 내용을 입력해 주세요.' };
    if (!days.length) return { ok: false, error: '요일을 하나 이상 선택해 주세요.' };
    if (!input.kidId || !kidById(input.kidId)) return { ok: false, error: '아이를 선택해 주세요.' };
    var payload = {
      kidId: input.kidId,
      title: title,
      days: days,
      time: String(input.time || '').trim(),
      memo: String(input.memo || '').trim()
    };
    var item = input.id ? routineById(input.id) : null;
    if (item) Object.assign(item, payload);
    else {
      item = Object.assign({ id: uid('rt') }, payload);
      state.data.routines.push(item);
    }
    save();
    return { ok: true, item: item };
  }

  function deleteRoutine(id) {
    state.data.routines = state.data.routines.filter(function (r) { return r.id !== id; });
    save();
  }

  function toggleRoutine(id) {
    var key = routineKey(id, L.dateKey(new Date()));
    if (state.data.checks[key]) delete state.data.checks[key];
    else state.data.checks[key] = Date.now();
    save();
  }

  function upsertHomework(input) {
    var title = String(input.title || '').trim();
    if (!title) return { ok: false, error: '숙제 내용을 입력해 주세요.' };
    if (!input.kidId || !kidById(input.kidId)) return { ok: false, error: '아이를 선택해 주세요.' };
    var payload = {
      kidId: input.kidId,
      classId: input.classId || '',
      title: title,
      due: input.due || L.dateKey(new Date()),
      memo: String(input.memo || '').trim()
    };
    var item = input.id ? homeworkById(input.id) : null;
    if (item) Object.assign(item, payload);
    else {
      item = Object.assign({ id: uid('hw'), done: false, doneAt: null, createdAt: new Date().toISOString() }, payload);
      state.data.homeworks.push(item);
    }
    save();
    return { ok: true, item: item };
  }

  function deleteHomework(id) {
    state.data.homeworks = state.data.homeworks.filter(function (h) { return h.id !== id; });
    save();
  }

  function toggleHomework(id) {
    var h = homeworkById(id);
    if (!h) return;
    h.done = !h.done;
    h.doneAt = h.done ? new Date().toISOString() : null;
    save();
  }

  /* ================= 표시 도우미 ================= */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function kidTag(id) {
    var k = kidById(id);
    if (!k) return '';
    return '<span class="tag" style="--c:' + esc(k.color) + '"><span class="tag-emoji" aria-hidden="true">' +
      esc(k.emoji) + '</span>' + esc(k.name) + '</span>';
  }

  function kidAccent(id) {
    var k = kidById(id);
    return k ? k.color : '#94a3b8';
  }

  function classTag(classId) {
    var c = classId ? classById(classId) : null;
    return c ? '<span class="tag tag-plain">' + esc(c.name) + '</span>' : '';
  }

  function timeLabel(c) {
    return c.start ? L.rangeText(c.start, c.end) : '시간 미정';
  }

  function whenText(date, now) {
    var ms = date - now;
    if (ms <= 0) return '지금';
    var mins = Math.round(ms / 60000);
    if (mins < 1) return '곧 시작';
    if (mins < 60) return mins + '분 남음';
    if (mins < 24 * 60) {
      var h = Math.floor(mins / 60), m = mins % 60;
      return m ? h + '시간 ' + m + '분 남음' : h + '시간 남음';
    }
    var dd = L.diffDays(date, now);
    if (dd === 1) return '내일 ' + L.clockText(L.hhmmOf(date));
    return dd + '일 후 ' + L.clockText(L.hhmmOf(date));
  }

  function liveText(cls, now) {
    var st = L.classStatus(cls, now);
    if (st.state === 'ongoing') return '수업 중 · ' + L.clockText(L.hhmmOf(st.end)) + ' 종료';
    if (st.state === 'none') return '';
    return whenText(st.start, now);
  }

  function headerLine() {
    var now = new Date();
    var parts = [L.dateLongText(now)];
    var n = todayOpenCount();
    parts.push(n > 0 ? '오늘 할 일 ' + n + '개' : '오늘 할 일 모두 완료 🎉');
    return parts.join(' · ');
  }

  /* ================= 상단/탭 ================= */

  function renderKidBar() {
    var chips = '<button class="kidchip' + (state.kid === 'all' ? ' on' : '') + '" data-action="set-kid" data-kid="all">전체</button>';
    chips += state.data.kids.map(function (k) {
      var on = state.kid === k.id;
      return '<button class="kidchip' + (on ? ' on' : '') + '" data-action="set-kid" data-kid="' + k.id + '"' +
        ' style="--c:' + esc(k.color) + '">' +
        '<span class="kidchip-emoji" aria-hidden="true">' + esc(k.emoji) + '</span>' + esc(k.name) + '</button>';
    }).join('');
    chips += '<button class="kidchip kidchip-add" data-action="add-kid" aria-label="아이 추가">＋</button>';
    return chips;
  }

  function renderTabBar() {
    var n = todayOpenCount();
    return TABS.map(function (t) {
      var on = state.view === t.id;
      var badge = (t.id === 'homework' && n > 0) ? '<span class="tab-badge">' + n + '</span>' : '';
      return '<button class="tab' + (on ? ' on' : '') + '" data-action="set-view" data-view="' + t.id + '"' +
        ' aria-current="' + (on ? 'page' : 'false') + '">' +
        '<span class="tab-icon" aria-hidden="true">' + t.icon + '</span>' +
        '<span class="tab-label">' + t.label + '</span>' + badge + '</button>';
    }).join('');
  }

  /* ================= 본문 ================= */

  function renderMain() {
    if (state.kid !== 'all' && !kidById(state.kid)) state.kid = 'all';
    /* 잠겨 있으면 설정 화면은 안내 카드로 막는다 (해시·새로고침·hash 링크로 바로 들어와도 동일) */
    if (state.view === 'settings' && lockRequired()) return lockedCard();
    if (!state.data.kids.length) {
      /* 아이가 없어도 설정(백업 복원 등)은 열 수 있어야 한다 */
      return state.view === 'settings' ? viewSettings() : onboardingCard();
    }
    if (state.view === 'schedule') return viewSchedule();
    if (state.view === 'homework') return viewHomework();
    if (state.view === 'settings') return viewSettings();
    return viewToday();
  }

  function onboardingCard() {
    return '<section class="card intro">' +
      '<div class="intro-emoji" aria-hidden="true">📚</div>' +
      '<h2>엄마다했쏙</h2>' +
      '<p>아이를 등록하면 학원 시간표와 매일 체크리스트를 한 화면에서 볼 수 있어요. 입력한 내용은 이 휴대폰에만 저장됩니다.</p>' +
      '<ol class="steps">' +
      '<li><b>1</b><span>아이 추가 (이름·색상)</span></li>' +
      '<li><b>2</b><span>학원 등록 (요일·시간)</span></li>' +
      '<li><b>3</b><span>체크리스트로 매일 확인</span></li>' +
      '</ol>' +
      '<div class="intro-actions">' +
      '<button class="btn primary block" data-action="add-kid">아이 추가하기</button>' +
      '<button class="btn ghost block" data-action="import-ics">📅 구글 캘린더(.ics)로 시작하기</button>' +
      '<button class="btn ghost block" data-action="load-sample">예시 계획표로 둘러보기</button>' +
      '<button class="btn ghost block" data-action="import-json">백업 불러오기</button>' +
      '</div></section>';
  }

  /* ---------- 오늘 ---------- */

  function viewToday() {
    var now = new Date();
    var classes = scopedClasses();
    var todays = L.todaysClasses(classes, now);
    var todayKey = L.dateKey(now);
    var dueHomeworks = L.sortHomeworks(openHomeworksDue());
    var next = L.nextClass(classes, now);
    var html = '';

    if (!state.data.classes.length) {
      html += '<section class="card notice">' +
        '<h2>아직 학원 일정이 없어요</h2>' +
        '<p>요일과 시간을 등록하면 오늘의 학원과 다음 수업까지 남은 시간을 알려드려요.</p>' +
        '<button class="btn primary" data-action="add-class">학원 등록하기</button></section>';
    } else if (next) {
      var st = next.status;
      html += '<section class="card hero" style="--c:' + esc(kidAccent(next.cls.kidId)) + '">' +
        '<div class="hero-top">' +
        '<span class="hero-eyebrow">' + (st.state === 'ongoing' ? '지금 수업 중' : '다음 수업') + '</span>' +
        '<span class="hero-when">' + esc(L.rangeText(next.cls.start, next.cls.end)) + '</span>' +
        '</div>' +
        '<div class="hero-name">' + esc(next.cls.name) + '</div>' +
        '<div class="hero-sub">' + kidTag(next.cls.kidId) +
        '<span class="hero-remain" data-live="cls:' + next.cls.id + '">' + esc(liveText(next.cls, now)) + '</span>' +
        '</div>' +
        (next.cls.place ? '<div class="hero-place">📍 ' + esc(next.cls.place) + '</div>' : '') +
        '<div class="hero-actions"><button class="btn tiny" data-action="edit-class" data-id="' + next.cls.id + '">일정 보기</button>' +
        (next.cls.memo ? '<span class="hero-memo">' + esc(next.cls.memo) + '</span>' : '') + '</div>' +
        '</section>';
    } else {
      html += '<section class="card hero" style="--c:var(--muted)">' +
        '<span class="hero-eyebrow">다음 수업</span>' +
        '<div class="hero-name">예정된 수업이 없어요</div>' +
        '<div class="hero-sub"><span class="hero-remain">학원 일정을 확인해 주세요</span></div></section>';
    }

    html += '<section class="card">' +
      '<header class="card-head"><h2>오늘의 학원</h2>' +
      '<span class="card-count">' + todays.length + '개</span>' +
      '<button class="btn tiny ghost" data-action="add-class">＋ 추가</button></header>' +
      (todays.length
        ? '<ul class="list">' + todays.map(function (c) { return classRow(c, now); }).join('') + '</ul>'
        : '<p class="empty">오늘은 등록된 학원이 없어요. 여유로운 하루 보내세요 🌿</p>') +
      '</section>';

    html += checklistCard({ compact: true });

    html += '<section class="card">' +
      '<header class="card-head"><h2>마감 숙제</h2>' +
      '<span class="card-count">' + dueHomeworks.length + '개</span>' +
      '<button class="btn tiny ghost" data-action="add-homework">＋ 추가</button></header>' +
      (dueHomeworks.length
        ? '<ul class="hwl">' + dueHomeworks.slice(0, 4).map(function (h) { return hwItem(h, now); }).join('') + '</ul>' +
        (dueHomeworks.length > 4 ? '<button class="btn tiny ghost block" data-action="set-view" data-view="homework">' + (dueHomeworks.length - 4) + '개 더 보기</button>' : '')
        : '<p class="empty">마감이 임박한 숙제가 없어요. 필요한 숙제는 ＋로 추가해 보세요.</p>') +
      '</section>';

    return html;
  }

  function classRow(c, now) {
    var st = L.classStatus(c, now);
    var label = !c.start ? '오늘' : (st.state === 'ongoing' ? '수업 중' : (st.state === 'today' ? liveText(c, now) : '오늘'));
    return '<li><button class="row" data-action="edit-class" data-id="' + c.id + '">' +
      '<span class="row-dot" style="--c:' + esc(kidAccent(c.kidId)) + '"></span>' +
      '<span class="row-main">' +
      '<span class="row-title">' + esc(c.name) + '</span>' +
      '<span class="row-sub">' + esc(timeLabel(c)) + (c.place ? ' · ' + esc(c.place) : '') + '</span>' +
      '</span>' +
      '<span class="row-side">' +
      '<span class="pill' + (st.state === 'ongoing' ? ' pill-live' : '') + '">' + esc(label) + '</span>' +
      (kidTag(c.kidId) ? '<span class="row-kid">' + kidTag(c.kidId) + '</span>' : '') +
      '</span></button></li>';
  }

  function hwItem(h, now) {
    var due = L.dueInfo(h.due, now);
    var meta = kidTag(h.kidId) + classTag(h.classId);
    return '<li class="hw' + (h.done ? ' is-done' : '') + '">' +
      '<button class="check' + (h.done ? ' on' : '') + '" data-action="toggle-hw" data-id="' + h.id + '"' +
      ' role="checkbox" aria-checked="' + (h.done ? 'true' : 'false') + '"' +
      ' aria-label="' + esc(h.title) + ' 완료 표시">' + (h.done ? '✓' : '') + '</button>' +
      '<button class="hw-body" data-action="edit-hw" data-id="' + h.id + '">' +
      '<span class="hw-title">' + esc(h.title) + '</span>' +
      (meta || h.memo ? '<span class="hw-meta">' + meta + (h.memo ? '<span class="hw-memo">' + esc(h.memo) + '</span>' : '') + '</span>' : '') +
      '</button>' +
      '<span class="due due--' + due.tone + '">' + esc(h.done ? '완료' : due.label) + '</span>' +
      '</li>';
  }

  /* ---------- 체크리스트 (오늘의 루틴) ---------- */

  function checklistCard(opts) {
    opts = opts || {};
    var compact = !!opts.compact;
    var key = L.dateKey(new Date());
    var list = todayRoutines();
    var groups = state.kid === 'all' ? state.data.kids : state.data.kids.filter(function (k) { return k.id === state.kid; });
    var totalStats = routineStats(list, key);

    var body = groups.map(function (k) {
      var mine = list.filter(function (r) { return r.kidId === k.id; });
      var stats = routineStats(mine, key);
      var open = mine.filter(function (r) { return !isRoutineDone(r, key); });
      var shown = compact ? open.slice(0, 3) : mine;
      var more = compact ? open.length - shown.length : 0;
      if (!mine.length) return '';
      return '<div class="kid-block" style="--c:' + esc(k.color) + '">' +
        '<div class="kid-block-head">' +
        '<span class="tag" style="--c:' + esc(k.color) + '"><span class="tag-emoji" aria-hidden="true">' + esc(k.emoji) + '</span>' + esc(k.name) + '</span>' +
        '<span class="prog-text">' + stats.done + '/' + stats.total + '</span>' +
        '</div>' +
        '<div class="prog"><span style="width:' + stats.pct + '%"></span></div>' +
        (shown.length
          ? '<ul class="hwl">' + shown.map(function (r) { return routineItem(r, key); }).join('') + '</ul>'
          : '<p class="empty small">오늘 체크리스트를 모두 마쳤어요 👏</p>') +
        (more > 0 ? '<button class="btn tiny ghost block" data-action="set-view" data-view="homework">' + more + '개 더 보기</button>' : '') +
        '</div>';
    }).filter(Boolean).join('');

    if (!list.length) {
      body = '<p class="empty">오늘은 체크리스트가 없어요. ＋로 매일 할 일을 등록해 보세요.</p>';
    }

    return '<section class="card">' +
      '<header class="card-head"><h2>오늘의 체크리스트</h2>' +
      '<span class="card-count">' + totalStats.done + '/' + totalStats.total + '</span>' +
      '<button class="btn tiny ghost" data-action="add-routine">＋ 할 일</button></header>' +
      body + '</section>';
  }

  function routineItem(r, key) {
    var done = isRoutineDone(r, key);
    return '<li class="hw' + (done ? ' is-done' : '') + '">' +
      '<button class="check' + (done ? ' on' : '') + '" data-action="toggle-routine" data-id="' + r.id + '"' +
      ' role="checkbox" aria-checked="' + (done ? 'true' : 'false') + '"' +
      ' aria-label="' + esc(r.title) + ' 완료 표시">' + (done ? '✓' : '') + '</button>' +
      '<button class="hw-body" data-action="edit-routine" data-id="' + r.id + '">' +
      '<span class="hw-title">' + esc(r.title) + '</span>' +
      (r.time || r.memo
        ? '<span class="hw-meta">' + (r.time ? '<span class="rt-time">' + esc(r.time) + '</span>' : '') +
        (r.memo ? '<span class="hw-memo">' + esc(r.memo) + '</span>' : '') + '</span>'
        : '') +
      '</button></li>';
  }

  /* ---------- 시간표 ---------- */

  function viewSchedule() {
    var now = new Date();
    var all = scopedClasses();
    var days = L.weekDates(now);
    var todayKey = L.dateKey(now);

    var rows = days.map(function (d) {
      var idx = L.dayIndex(d);
      var items = all.filter(function (c) { return (c.days || []).indexOf(idx) >= 0; })
        .sort(function (a, b) { return (L.hhmmToMinutes(a.start) || 0) - (L.hhmmToMinutes(b.start) || 0); });
      var isToday = L.dateKey(d) === todayKey;
      return '<div class="wrow' + (isToday ? ' is-today' : '') + '">' +
        '<div class="wday"><b>' + L.dayLabel(idx) + '</b><span>' + L.monthDay(d) + '</span></div>' +
        '<div class="witems">' +
        (items.length ? items.map(classChip).join('') : '<span class="wempty">—</span>') +
        '</div></div>';
    }).join('');

    var managed = state.data.classes.slice().sort(function (a, b) {
      return (L.hhmmToMinutes(a.start) || 0) - (L.hhmmToMinutes(b.start) || 0);
    }).map(function (c) {
      return '<li><div class="mng">' +
        '<span class="row-dot" style="--c:' + esc(kidAccent(c.kidId)) + '"></span>' +
        '<div class="mng-main">' +
        '<div class="mng-title">' + esc(c.name) + '</div>' +
        '<div class="mng-sub">' + (c.days || []).map(L.dayLabel).join('·') + ' · ' + esc(timeLabel(c)) +
        (c.place ? ' · ' + esc(c.place) : '') + '</div>' +
        '<div class="mng-tags">' + kidTag(c.kidId) + (c.memo ? '<span class="tag tag-plain">' + esc(c.memo) + '</span>' : '') + '</div>' +
        '</div>' +
        '<button class="btn tiny" data-action="edit-class" data-id="' + c.id + '">수정</button>' +
        '</div></li>';
    }).join('');

    return viewSwitchBar() +
      '<section class="card ics-import-card">' +
      '<header class="card-head"><h2>캘린더에서 가져오기</h2><span class="card-count">.ics</span></header>' +
      '<p class="card-desc">구글 캘린더에서 내보낸 파일을 불러오면 학원 일정이 이 시간표에 자동으로 채워져요.</p>' +
      '<button class="btn primary block" data-action="import-ics">📅 구글 캘린더(.ics) 불러오기</button>' +
      '</section>' +
      '<section class="card">' +
      '<header class="card-head"><h2>이번 주 시간표</h2>' +
      '<button class="btn tiny" data-action="open-grid">📊 표로 보기</button>' +
      '<button class="btn tiny" data-action="add-class">＋ 학원</button></header>' +
      '<div class="week">' + rows + '</div></section>' +
      '<section class="card">' +
      '<header class="card-head"><h2>등록된 학원</h2><span class="card-count">' + state.data.classes.length + '개</span></header>' +
      (state.data.classes.length ? '<ul class="list mng-list">' + managed + '</ul>' : '<p class="empty">아직 등록된 학원이 없어요.</p>') +
      '</section>';
  }

  function classChip(c) {
    return '<button class="chip-class" style="--c:' + esc(kidAccent(c.kidId)) + '" data-action="edit-class" data-id="' + c.id + '">' +
      '<span class="chip-name">' + esc(c.name) + '</span>' +
      '<span class="chip-time">' + esc(timeLabel(c)) + '</span>' +
      '</button>';
  }

  /* ---------- 한눈에 보기 (월~일 주간 표) ----------
     읽기 전용 화면이다. 잠겨 있어도 PIN 없이 열리고, 칸을 눌러 수정할 때만
     기존처럼 보기 전용 → 비밀번호 확인 순서를 거친다. */

  function viewSwitchBar() {
    return '<div class="view-switch" role="group" aria-label="시간표 보기 방식">' +
      '<span class="view-switch-on" aria-current="true">📋 목록 보기</span>' +
      '<button class="view-switch-btn" type="button" data-action="open-grid">📊 한눈에 보기</button>' +
      '</div>';
  }

  function gridOpts() {
    if (!state.grid) {
      state.grid = { kid: state.kid === 'all' ? 'all' : state.kid, weekend: 'auto', zoom: savedZoom() };
    }
    if (state.grid.kid !== 'all' && !kidById(state.grid.kid)) state.grid.kid = 'all';
    if (['auto', 'always', 'never'].indexOf(state.grid.weekend) < 0) state.grid.weekend = 'auto';
    if (['fit', 'big'].indexOf(state.grid.zoom) < 0) state.grid.zoom = savedZoom();
    return state.grid;
  }

  /* 표를 여는 방식(한눈에 맞추기 / 크게 보기)은 마지막에 고른 쪽으로 기억한다 */
  function savedZoom() {
    var z = state.data && state.data.settings ? state.data.settings.gridZoom : 'fit';
    return z === 'big' ? 'big' : 'fit';
  }

  /* 보기 전용이라 잠금과 상관없이 바로 연다 (읽기는 막지 않는다) */
  function openGrid(kidId) {
    state.grid = { kid: kidId || (state.kid === 'all' ? 'all' : state.kid), weekend: 'auto', zoom: savedZoom() };
    state.sheet = null;
    renderAll();
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  function closeGrid() {
    state.grid = null;
    renderAll();
  }

  function gridKids() {
    var g = gridOpts();
    if (g.kid === 'all') return state.data.kids.slice();
    var k = kidById(g.kid);
    return k ? [k] : state.data.kids.slice();
  }

  function gridScope() {
    var g = gridOpts();
    return g.kid === 'all' ? state.data.classes.slice() : state.data.classes.filter(function (c) { return c.kidId === g.kid; });
  }

  function gridWeekText() {
    var dates = L.weekDates(new Date());
    var a = dates[0], b = dates[6];
    var tail = (a.getMonth() === b.getMonth() ? b.getDate() + '일' : (b.getMonth() + 1) + '월 ' + b.getDate() + '일');
    return (a.getMonth() + 1) + '월 ' + a.getDate() + '일(' + L.dayLabel(L.dayIndex(a)) + ') ~ ' + tail + '(' + L.dayLabel(L.dayIndex(b)) + ')';
  }

  function pctText(x) {
    var n = Math.round((Number(x) || 0) * 10000) / 100;
    return n + '%';
  }

  function gridKidChips() {
    var g = gridOpts();
    if (state.data.kids.length < 2) return '';
    var chips = '<button class="seg-btn' + (g.kid === 'all' ? ' on' : '') + '" type="button" data-action="grid-kid" data-kid="all">👥 모든 아이</button>';
    chips += state.data.kids.map(function (k) {
      return '<button class="seg-btn' + (g.kid === k.id ? ' on' : '') + '" type="button" data-action="grid-kid" data-kid="' + k.id + '">' +
        '<span class="seg-emoji" aria-hidden="true">' + esc(k.emoji) + '</span>' + esc(k.name) + '</button>';
    }).join('');
    return '<div class="seg" role="group" aria-label="아이 골라 보기">' + chips + '</div>';
  }

  function gridEventHtml(e) {
    /* 칸 경계선에 딱 붙지 않게 위아래·좌우로 2px씩 띄운다 */
    var style = '--h:' + e.hue + ';top:calc(' + pctText(e.top) + ' + 2px);height:calc(' + pctText(e.height) + ' - 4px)' +
      ';left:calc(' + pctText(e.left) + ' + 1px);width:calc(' + pctText(e.width) + ' - 2px)';
    var tip = e.name + ' ' + e.timeText + (e.place ? ' · ' + e.place : '') + (e.memo ? ' · ' + e.memo : '');
    var span = String(e.timeText).split('~');
    return '<button class="tt-ev' + (e.compact ? ' is-compact' : '') + '" type="button" style="' + style + '"' +
      ' data-action="edit-class" data-id="' + esc(e.id) + '" title="' + esc(tip) + '">' +
      '<span class="tt-ev-name">' + esc(e.name) + '</span>' +
      '<span class="tt-ev-time"><span>' + esc(span[0]) + '</span><span>~' + esc(span[1] || '') + '</span></span>' +
      '</button>';
  }

  function gridBlock(kid) {
    var g = gridOpts();
    var mine = state.data.classes.filter(function (c) { return c.kidId === kid.id; });
    var view = L.weekGrid(mine, { hideWeekend: g.weekend });
    var dates = L.weekDates(new Date());
    var todayIdx = L.dayIndex(new Date());

    var head = '<header class="tt-block-head">' +
      '<span class="tag" style="--c:' + esc(kid.color) + '"><span class="tag-emoji" aria-hidden="true">' + esc(kid.emoji) + '</span>' + esc(kid.name) + '</span>' +
      '<span class="tt-count">학원 ' + mine.length + '개</span></header>';

    var dayHeads = view.days.map(function (d) {
      var on = d === todayIdx;
      return '<div class="tt-dayhead' + (d === 6 ? ' is-sat' : d === 7 ? ' is-sun' : '') + (on ? ' is-today' : '') + '"' +
        (on ? ' aria-current="date"' : '') + '>' +
        '<b>' + L.dayLabel(d) + '</b><span>' + L.monthDay(dates[d - 1]) + '</span></div>';
    }).join('');

    var allDayCells = view.days.map(function (d) {
      var chips = view.allDay.filter(function (e) { return e.day === d; }).map(function (e) {
        return '<button class="tt-allday-chip" type="button" data-action="edit-class" data-id="' + esc(e.id) + '"' +
          ' title="' + esc(e.name + (e.memo ? ' · ' + e.memo : '')) + '">' + esc(e.name) + '</button>';
      }).join('');
      return '<div class="tt-allday-cell' + (d > 5 ? ' is-weekend' : '') + (d === todayIdx ? ' is-today' : '') + '">' + chips + '</div>';
    }).join('');

    var hourLabels = view.rows.map(function (r) {
      return '<div class="tt-hour" title="' + esc(r.label) + '"><b>' + esc(r.from) + '</b><span>~' + esc(r.to) + '</span></div>';
    }).join('');

    var cols = view.days.map(function (d) {
      var evs = view.events.filter(function (e) { return e.day === d; }).map(gridEventHtml).join('');
      return '<div class="tt-col' + (d > 5 ? ' is-weekend' : '') + (d === todayIdx ? ' is-today' : '') + '">' + evs + '</div>';
    }).join('');

    var tracks = view.rows.length
      ? '<div class="tt-hours" aria-hidden="true">' + hourLabels + '</div>' +
        '<div class="tt-cols">' + cols + '</div>'
      : '';

    var note = view.empty ? '<p class="tt-empty">이번 주에 등록된 학원이 없어요.</p>' : '';

    return '<section class="tt-block" style="--c:' + esc(kid.color) + '">' + head + note +
      (view.empty ? '' :
        '<div class="tt-scroll">' +
        '<div class="tt' + (view.days.length >= 7 ? ' is-dense' : '') + '" style="--rows:' + (view.rows.length || 1) +
        ';--days:' + view.days.length + '">' +
        '<div class="tt-corner" aria-hidden="true">시간</div>' +
        '<div class="tt-days">' + dayHeads + '</div>' +
        '<div class="tt-allday-label"><b>종일</b><span>메모</span></div>' +
        '<div class="tt-allday">' + allDayCells + '</div>' +
        tracks +
        '</div></div>') +
      '</section>';
  }

  function gridHtml() {
    var g = gridOpts();
    var scoped = gridScope();
    var hasWeekend = scoped.some(function (c) {
      return (c.days || []).indexOf(6) >= 0 || (c.days || []).indexOf(7) >= 0;
    });
    var weekendHidden = g.weekend === 'always' || (g.weekend === 'auto' && !hasWeekend);
    var blocks = gridKids().map(gridBlock).join('');
    if (!scoped.length) {
      var who = g.kid === 'all' ? '' : esc((kidById(g.kid) || {}).name || '') + '의 ';
      blocks = '<section class="card notice grid-notice">' +
        '<h2>이번 주 학원 일정이 없어요</h2>' +
        '<p>' + who + '학원을 등록하면 월~일 표에 바로 채워져요.</p>' +
        '<button class="btn primary" type="button" data-action="add-class">학원 등록하기</button></section>';
    }

    return '<div class="grid-overlay' + (g.zoom === 'big' ? ' is-zoom-big' : '') + '" role="dialog" aria-modal="true" aria-label="주간 시간표 한눈에 보기">' +
      '<div class="grid-top">' +
      '<div class="grid-top-row">' +
      '<div class="grid-title-wrap"><h2 class="grid-title">📊 한눈에 보기</h2>' +
      '<p class="grid-week">' + esc(gridWeekText()) + '</p></div>' +
      '<div class="grid-actions">' +
      '<button class="btn tiny ghost" type="button" data-action="print-grid">🖨️ 인쇄/PDF</button>' +
      '<button class="icon-btn grid-close" type="button" data-action="close-grid" aria-label="닫기">✕</button>' +
      '</div></div>' +
      '<div class="grid-tools">' + gridKidChips() +
      '<button class="btn tiny ghost" type="button" data-action="grid-weekend">' +
      (weekendHidden ? '토·일 보기' : '토·일 숨기기') + '</button>' +
      '<button class="btn tiny ghost" type="button" data-action="grid-zoom" aria-pressed="' + (g.zoom === 'big' ? 'true' : 'false') + '">' +
      (g.zoom === 'big' ? '📱 한눈에 맞추기' : '🔍 크게 보기') + '</button>' +
      '<span class="grid-hint">' + (lockRequired() ? '🔒 칸을 누르면 보기 전용으로 열려요' : '칸을 누르면 일정을 볼 수 있어요') + '</span>' +
      '</div></div>' +
      '<div class="grid-body"><div class="grid-blocks">' + blocks + '</div></div></div>';
  }

  function renderGrid() {
    var root = document.getElementById('gridRoot');
    if (!root) return;
    if (!state.grid) {
      root.innerHTML = '';
      document.body.classList.remove('grid-open');
      return;
    }
    document.body.classList.add('grid-open');
    root.innerHTML = gridHtml();
  }

  function printGrid() {
    if (!state.grid) return;
    try { window.print(); } catch (e) { toast('이 브라우저에서는 인쇄를 열 수 없어요.'); }
  }

  /* ---------- 숙제 ---------- */

  function viewHomework() {
    var now = new Date();
    var works = L.sortHomeworks(scopedHomeworks());
    var open = works.filter(function (h) { return !h.done; });
    var done = works.filter(function (h) { return h.done; });
    var todayKey = L.dateKey(now);
    var shown = state.hwFilter === 'open' ? open : (state.hwFilter === 'done' ? done : works);
    var filters = [
      { id: 'open', label: '미완료 ' + open.length },
      { id: 'all', label: '전체 ' + works.length },
      { id: 'done', label: '완료 ' + done.length }
    ];
    var dueTodayCount = open.filter(function (h) { return h.due === todayKey; }).length;

    var body = shown.length
      ? '<ul class="hwl">' + shown.map(function (h) { return hwItem(h, now); }).join('') + '</ul>'
      : '<p class="empty">' + (state.hwFilter === 'done' ? '완료한 숙제가 없어요.' : '마감일이 있는 숙제가 없어요. 시험이나 준비물은 여기에 추가해 두세요.') + '</p>';

    return checklistCard({ compact: false }) +
      '<section class="card">' +
      '<header class="card-head"><h2>숙제</h2>' +
      '<button class="btn tiny" data-action="add-homework">＋ 숙제</button></header>' +
      '<div class="filters">' + filters.map(function (f) {
        return '<button class="fchip' + (state.hwFilter === f.id ? ' on' : '') + '" data-action="set-hw-filter" data-filter="' + f.id + '">' + f.label + '</button>';
      }).join('') + '</div>' +
      (dueTodayCount ? '<div class="banner">⏰ 오늘 마감 숙제가 ' + dueTodayCount + '개 있어요</div>' : '') +
      body + '</section>';
  }

  /* ---------- 설정 ---------- */

  /* 설정 맨 위: 관리자(엄마) 비밀번호 카드 */
  function lockCard() {
    var lock = lockInfo();
    var on = !!lock.hash;
    var stateText = !on ? '아직 없음' : (state.unlocked ? '풀림' : '잠김');
    var autoOpts = [
      { v: 1, t: '1분' }, { v: 5, t: '5분' }, { v: 10, t: '10분' }, { v: 30, t: '30분' }, { v: 0, t: '자동 잠금 없음' }
    ];

    var actions = on
      ? '<div class="btn-row">' +
        (state.unlocked
          ? '<button class="btn ghost" data-action="lock-now">지금 잠그기</button>'
          : '<button class="btn primary" data-action="lock-unlock">비밀번호 입력</button>') +
        '<button class="btn ghost" data-action="lock-set">비밀번호 변경</button>' +
        '</div>' +
        '<div class="btn-row"><button class="btn ghost danger" data-action="lock-off">비밀번호 삭제</button></div>'
      : '<button class="btn primary block" data-action="lock-set">비밀번호 설정</button>';

    return '<section class="card lock-card">' +
      '<header class="card-head"><h2>🔒 관리자(엄마) 비밀번호</h2><span class="pill' + (on && !state.unlocked ? ' pill-live' : '') + '">' + stateText + '</span></header>' +
      '<p class="card-desc">' + (on

  function settingToggle(key, label, on) {
