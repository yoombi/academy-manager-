<style>
/* 아이별 학원·숙제 관리 — 모바일 퍼스트 스타일 */
:root {
  --bg: #f4f5fa;
  --surface: #ffffff;
  --surface-2: #f7f8fc;
  --line: #e6e8f1;
  --text: #191b27;
  --text-2: #4b5162;
  --muted: #8a90a2;
  --accent: #4f46e5;
  --accent-2: #6366f1;
  --accent-soft: #eef0ff;
  --danger: #e11d48;
  --danger-soft: #ffe9ee;
  --ok: #16a34a;
  --warn: #d97706;
  --warn-soft: #fff4e0;
  --today-soft: #fff1f0;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 1px 2px rgba(20, 24, 40, .04), 0 10px 24px -12px rgba(20, 24, 40, .14);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1017;
    --surface: #171a24;
    --surface-2: #1e222e;
    --line: #2a2f3d;
    --text: #eef0f7;
    --text-2: #c3c8d6;
    --muted: #8b93a7;
    --accent: #818cf8;
    --accent-2: #6366f1;
    --accent-soft: #232544;
    --danger: #fb7185;
    --danger-soft: #3a1b25;
    --warn: #fbbf24;
    --warn-soft: #3a2c14;
    --today-soft: #34201f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 28px -14px rgba(0, 0, 0, .6);
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic",
    "Noto Sans KR", "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}

body.sheet-open { overflow: hidden; }

button { font-family: inherit; font-size: inherit; color: inherit; }
ul, ol { margin: 0; padding: 0; list-style: none; }
h1, h2, h3, p { margin: 0; }

/* ---------- 상단 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid transparent;
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar::after {
  content: "";
  display: block;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line), transparent);
}
.topbar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px 6px;
  max-width: 620px;
  margin: 0 auto;
}
.brand-text { flex: 1; min-width: 0; }
.brand-text h1 {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -.02em;
}
.today-line {
  font-size: 12.5px;
  color: var(--muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.icon-btn {
  border: 0;
  background: var(--surface);
  width: 38px;
  height: 38px;
  border-radius: 12px;
  font-size: 17px;
  display: grid;
  place-items: center;
  box-shadow: var(--shadow);
  cursor: pointer;
}

/* ---------- 아이 칩 ---------- */
.kidbar {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 6px 16px 12px;
  max-width: 620px;
  margin: 0 auto;
  scrollbar-width: none;
}
.kidbar::-webkit-scrollbar { display: none; }
.kidchip {
  flex: 0 0 auto;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 7px 13px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-2);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: transform .12s ease, background .15s ease;
}
.kidchip:active { transform: scale(.96); }
.kidchip.on {
  background: var(--c, var(--accent));
  border-color: transparent;
  color: #fff;
  box-shadow: 0 6px 14px -8px var(--c, var(--accent));
}
.kidchip-emoji { font-size: 14px; }
.kidchip-add {
  font-weight: 700;
  color: var(--muted);
  padding: 7px 12px;
}

/* ---------- 본문 ---------- */
.main {
  max-width: 620px;
  margin: 0 auto;
  padding: 4px 16px calc(96px + var(--safe-b));
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  border: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
}
.card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.card-head h2 {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -.01em;
  flex: 1;
}
.card-count {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}
.card-desc {
  font-size: 13px;
  color: var(--text-2);
  margin-bottom: 12px;
  line-height: 1.55;
}
.card-desc.muted { color: var(--muted); font-size: 12.5px; margin-top: 10px; margin-bottom: 0; }
.empty {
  font-size: 13.5px;
  color: var(--muted);
  padding: 10px 2px 6px;
  line-height: 1.55;
}
.footnote {
  text-align: center;
  font-size: 11.5px;
  color: var(--muted);
  padding: 4px 0 8px;
}

/* ---------- 버튼 ---------- */
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  padding: 9px 14px;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: transform .12s ease, filter .15s ease;
}
.btn:active { transform: scale(.97); }
.btn.primary {
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  border-color: transparent;
  color: #fff;
  box-shadow: 0 8px 18px -10px var(--accent);
}
.btn.ghost { background: var(--surface-2); color: var(--text-2); }
.btn.danger { color: var(--danger); }
.btn.tiny { padding: 6px 10px; font-size: 12.5px; border-radius: 10px; }
.btn.block { display: block; width: 100%; padding: 12px; font-size: 14.5px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 0; min-width: 96px; }

/* ---------- 히어로 (다음 수업) ---------- */
.hero {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--c) 22%, transparent) 0%, transparent 60%),
    var(--surface);
  border: 1px solid color-mix(in srgb, var(--c) 26%, var(--line));
}
.hero-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}
.hero-eyebrow {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .04em;
  color: var(--c);
  text-transform: uppercase;
}
.hero-when { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.hero-name {
  font-size: 24px;
  font-weight: 850;
  letter-spacing: -.03em;
  margin: 8px 0 6px;
  line-height: 1.2;
}
.hero-sub {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 13.5px;
  color: var(--text-2);
}
.hero-remain {
  font-weight: 800;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 12%, transparent);
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 12.5px;
}
.hero-place { margin-top: 8px; font-size: 13px; color: var(--text-2); }
.hero-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
}
.hero-memo {
  font-size: 12.5px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hero-empty { background: var(--surface); }

/* ---------- 오늘의 학원 행 ---------- */
.list { display: flex; flex-direction: column; }
.list > li + li { border-top: 1px solid var(--line); }
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  border: 0;
  background: none;
  padding: 11px 2px;
  text-align: left;
  cursor: pointer;
}
.row-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--c, var(--accent));
  flex: 0 0 auto;
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--c, var(--accent)) 16%, transparent);
}
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-title {
  font-size: 14.5px;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row-sub { font-size: 12.5px; color: var(--muted); }
.row-side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.row-kid { display: flex; }

.pill {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-2);
  background: var(--surface-2);
  border-radius: 999px;
  padding: 3px 9px;
  white-space: nowrap;
}
.pill-live { color: var(--accent); background: var(--accent-soft); }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--c, var(--text-2));
  background: color-mix(in srgb, var(--c, var(--muted)) 13%, transparent);
  border-radius: 999px;
  padding: 2px 8px;
  white-space: nowrap;
}
.tag-emoji { font-size: 11px; }
.tag-plain {
  color: var(--muted);
  background: var(--surface-2);
}

/* ---------- 숙제 ---------- */
.hwl { display: flex; flex-direction: column; }
.hwl > li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 2px;
}
.hwl > li + li { border-top: 1px solid var(--line); }
.check {
  flex: 0 0 auto;
  width: 26px;
  height: 26px;
  border-radius: 9px;
  border: 1.8px solid var(--line);
  background: var(--surface);
  color: #fff;
  font-size: 14px;
  font-weight: 800;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform .12s ease, background .15s ease, border-color .15s ease;
}
.check:active { transform: scale(.9); }
.check.on {
  background: var(--ok);
  border-color: var(--ok);
}
.hw-body {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  text-align: left;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
}
.hw-title { font-size: 14.5px; font-weight: 650; line-height: 1.35; word-break: break-word; }
.is-done .hw-title { color: var(--muted); text-decoration: line-through; }
.hw-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.hw-memo {
  font-size: 12px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 150px;
}
.due {
  flex: 0 0 auto;
  font-size: 11.5px;
  font-weight: 800;
  padding: 4px 8px;
  border-radius: 8px;
  white-space: nowrap;
}
.due--late { color: var(--danger); background: var(--danger-soft); }
.due--today { color: #fff; background: var(--danger); }
.due--soon { color: var(--warn); background: var(--warn-soft); }
.due--later, .due--none { color: var(--muted); background: var(--surface-2); }
.is-done .due { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }

.kid-block { padding-top: 10px; }
.kid-block + .kid-block { border-top: 1px solid var(--line); margin-top: 10px; }
.kid-block-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
.kid-block .hwl > li { padding: 8px 2px; }
.prog {
  height: 5px;
  border-radius: 999px;
  background: var(--surface-2);
  overflow: hidden;
  margin-bottom: 4px;
}
.prog > span {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--c, var(--accent));
  transition: width .25s ease;
}
.prog-text { font-size: 12px; font-weight: 800; color: var(--text-2); }
.empty.small { font-size: 12.5px; padding: 8px 2px; }
.rt-time {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-2);
  background: var(--surface-2);
  padding: 2px 7px;
  border-radius: 7px;
}
.hwl .btn.block { margin-top: 8px; }
.hint-line { font-size: 11.5px; color: var(--muted); margin: -4px 0 10px; line-height: 1.5; }
.banner {
  background: var(--danger-soft);
  color: var(--danger);
  font-size: 13px;
  font-weight: 700;
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  margin-bottom: 8px;
}

/* ---------- 필터 ---------- */
.filters { display: flex; gap: 7px; margin-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.fchip {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--text-2);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 12.5px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
}
.fchip.on { background: var(--accent); border-color: transparent; color: #fff; }

/* ---------- 주간 시간표 ---------- */
.week { display: flex; flex-direction: column; }
.wrow {
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 10px;
  padding: 8px 0;
  align-items: start;
}
.wrow + .wrow { border-top: 1px dashed var(--line); }
.wrow.is-today { background: color-mix(in srgb, var(--accent) 6%, transparent); border-radius: 10px; }
.wday {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding-top: 2px;
}
.wday b { font-size: 13px; font-weight: 800; }
.wrow.is-today .wday b { color: var(--accent); }
.wday span { font-size: 10.5px; color: var(--muted); }
.witems { display: flex; flex-direction: column; gap: 6px; min-height: 24px; justify-content: center; }
.wempty { color: var(--muted); font-size: 12.5px; }
.chip-class {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid color-mix(in srgb, var(--c) 28%, var(--line));
  background: color-mix(in srgb, var(--c) 8%, var(--surface));
  border-radius: 11px;
  padding: 7px 10px;
  text-align: left;
  cursor: pointer;
  border-left: 3px solid var(--c);
}
.chip-name {
  font-size: 13.5px;
  font-weight: 750;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chip-time { font-size: 11.5px; color: var(--text-2); font-weight: 600; white-space: nowrap; }

/* ---------- 학원 관리 목록 ---------- */
.mng { display: flex; align-items: center; gap: 10px; padding: 11px 2px; }
.mng-main { flex: 1; min-width: 0; }
.mng-title { font-size: 14.5px; font-weight: 700; }
.mng-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.mng-tags { margin-top: 5px; display: flex; gap: 4px; flex-wrap: wrap; }
.mng-list > li + li { border-top: 1px solid var(--line); }

/* ---------- 온보딩 ---------- */
.intro { text-align: center; padding: 24px 18px; }
.intro-emoji { font-size: 40px; line-height: 1; }
.intro h2 { font-size: 19px; font-weight: 850; margin: 12px 0 8px; letter-spacing: -.02em; }
.intro p { font-size: 13.5px; color: var(--text-2); line-height: 1.6; }
.steps {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 18px 0;
  text-align: left;
}
.steps li {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 13.5px;
  color: var(--text-2);
}
.steps b {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 12px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
}
.steps.small li { padding: 8px 11px; font-size: 13px; }
.intro-actions { display: flex; flex-direction: column; gap: 8px; }
.notice h2 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
.notice p { font-size: 13.5px; color: var(--text-2); line-height: 1.55; margin-bottom: 12px; }

/* ---------- 설정 ---------- */
.setting {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 0;
  border-top: 1px solid var(--line);
}
.setting:first-of-type { border-top: 0; }
.setting-label { flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-note {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.55;

<script>
/* 아이별 학원·숙제 관리 — 공용 로직 (DOM 없이 동작, node/테스트에서도 사용) */
(function (global) {
  'use strict';

  var DAY_LABELS = ['월', '화', '수', '목', '금', '토', '일'];
  var DAY_LONGS = ['월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'];
  var ICS_BYDAY = ['MO', 'TU', 'WE', 'TH', 'FR', 'SA', 'SU'];

  function pad2(n) { return String(n).padStart(2, '0'); }

  /* ---------- 날짜/시간 ---------- */

  function dateKey(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }

  function parseDateKey(s) {
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s || ''));
    if (!m) return null;
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return isNaN(d.getTime()) ? null : d;
  }

  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  /* 월=1 … 일=7 */
  function dayIndex(d) { return ((d.getDay() + 6) % 7) + 1; }
  function dayLabel(i) { return DAY_LABELS[i - 1] || ''; }
  function dayLong(i) { return DAY_LONGS[i - 1] || ''; }

  function hhmmToMinutes(s) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(String(s || ''));
    if (!m) return null;
    var h = Number(m[1]), mi = Number(m[2]);
    if (h > 24 || mi > 59) return null;
    return h * 60 + mi;
  }

  function minutesToHHMM(mins) {
    var m = ((Math.round(mins) % 1440) + 1440) % 1440;
    return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60);
  }

  function hhmmOf(date) { return pad2(date.getHours()) + ':' + pad2(date.getMinutes()); }

  /* "오후 4:30" */
  function clockText(hhmm) {
    var mins = hhmmToMinutes(hhmm);
    if (mins == null) return '';
    var h = Math.floor(mins / 60), m = mins % 60;
    var ampm = h < 12 ? '오전' : '오후';
    var hh = h % 12;
    if (hh === 0) hh = 12;
    return ampm + ' ' + hh + ':' + pad2(m);
  }

  function rangeText(a, b) {
    var s = clockText(a);
    if (!s) return '';
    var e = clockText(b);
    return e ? s + '–' + e : s;
  }

  function atTime(date, hhmm) {
    var mins = hhmmToMinutes(hhmm);
    if (mins == null) mins = 0;
    return new Date(date.getFullYear(), date.getMonth(), date.getDate(), Math.floor(mins / 60), mins % 60, 0, 0);
  }

  function diffDays(a, b) {
    return Math.round((startOfDay(a) - startOfDay(b)) / 86400000);
  }

  function monthDay(date) { return (date.getMonth() + 1) + '/' + date.getDate(); }

  function dateLongText(date) {
    return (date.getMonth() + 1) + '월 ' + date.getDate() + '일 ' + dayLong(dayIndex(date));
  }

  /* 이번 주 월요일 */
  function weekStart(date) {
    var idx = dayIndex(date);
    return new Date(date.getFullYear(), date.getMonth(), date.getDate() - (idx - 1));
  }

  function weekDates(date) {
    var start = weekStart(date);
    var out = [];
    for (var i = 0; i < 7; i++) out.push(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
    return out;
  }

  /* ---------- 수업 ---------- */

  function classOn(cls, date) {
    return (cls.days || []).indexOf(dayIndex(date)) >= 0;
  }

  /* 시간이 비어 있는 일정(도서관 등)은 종일(allDay)로 본다 */
  function classBounds(cls, date) {
    var base = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 0, 0, 0, 0);
    var startMin = hhmmToMinutes(cls.start);
    if (startMin == null) {
      return { allDay: true, start: base, end: new Date(base.getTime() + 86400000) };
    }
    var endMin = hhmmToMinutes(cls.end);
    if (endMin == null || endMin <= startMin) endMin = startMin + 60;
    return {
      allDay: false,
      start: new Date(base.getTime() + startMin * 60000),
      end: new Date(base.getTime() + endMin * 60000)
    };
  }

  /* 오늘 수업 상태 + 다음 수업 정보
     state: ongoing(수업 중) | today(오늘 남음) | future(다음 수업) | none */
  function classStatus(cls, now) {
    if (hhmmToMinutes(cls.start) == null) return { state: 'none' }; /* 시간 미정 일정은 셈에서 제외 */
    if (classOn(cls, now)) {
      var b = classBounds(cls, now);
      if (now >= b.start && now < b.end) return { state: 'ongoing', start: b.start, end: b.end, daysAhead: 0 };
      if (now < b.start) return { state: 'today', start: b.start, end: b.end, daysAhead: 0 };
    }
    for (var i = 1; i <= 15; i++) {
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
      if (classOn(cls, d)) {
        var bb = classBounds(cls, d);
        return { state: 'future', start: bb.start, end: bb.end, daysAhead: i };
      }
    }
    return { state: 'none' };
  }

  /* 가장 가까운 수업 (진행 중인 수업이 있으면 그것을 우선) */
  function nextClass(classes, now) {
    var best = null;
    (classes || []).forEach(function (cls) {
      var st = classStatus(cls, now);
      if (st.state === 'none') return;
      if (!best) { best = { cls: cls, status: st }; return; }
      if (st.start < best.status.start) best = { cls: cls, status: st };
    });
    return best;
  }

  function todaysClasses(classes, now) {
    return (classes || []).filter(function (c) { return classOn(c, now); })
      .sort(function (a, b) { return (hhmmToMinutes(a.start) || 0) - (hhmmToMinutes(b.start) || 0); });
  }

  /* ---------- 숙제 ---------- */

  function dueInfo(due, now) {
    var d = parseDateKey(due);
    if (!d) return { label: '마감일 없음', tone: 'none', days: null };
    var diff = diffDays(d, now);
    if (diff < 0) return { label: diff === -1 ? '어제 마감' : (-diff) + '일 지남', tone: 'late', days: diff };
    if (diff === 0) return { label: '오늘 마감', tone: 'today', days: 0 };
    if (diff === 1) return { label: '내일 마감', tone: 'soon', days: 1 };
    if (diff <= 3) return { label: 'D-' + diff, tone: 'soon', days: diff };
    if (diff <= 7) return { label: 'D-' + diff, tone: 'later', days: diff };
    return { label: monthDay(d), tone: 'later', days: diff };
  }

  function sortHomeworks(list) {
    return (list || []).slice().sort(function (a, b) {
      if (!!a.done !== !!b.done) return a.done ? 1 : -1;
      var da = a.due || '9999-12-31', db = b.due || '9999-12-31';
      if (da !== db) return da < db ? -1 : 1;
      return String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
    });
  }

  /* ---------- .ics 내보내기 ---------- */

  function utf8Len(ch) {
    var c = ch.codePointAt(0);
    if (c < 0x80) return 1;
    if (c < 0x800) return 2;
    if (c < 0x10000) return 3;
    return 4;
  }

  function icsEscape(text) {
    return String(text == null ? '' : text)
      .replace(/\\/g, '\\\\')
      .replace(/;/g, '\\;')
      .replace(/,/g, '\\,')
      .replace(/\r?\n/g, '\\n');
  }

  /* RFC 5545 75옥텟 접기 (UTF-8 문자를 쪼개지 않음) */
  function foldLine(line) {
    var out = [], cur = '', bytes = 0;
    Array.from(String(line)).forEach(function (ch) {
      var b = utf8Len(ch);
      if (cur && bytes + b > 73) { out.push(cur); cur = ''; bytes = 0; }
      cur += ch; bytes += b;
    });
    out.push(cur);
    return out.join('\r\n ');
  }

  function utcStamp(d) {
    return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) +
      'T' + pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z';
  }

  function ymdCompact(d) {
    return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());
  }

  /* opt: { kids, classes, homeworks, now, includeClasses, includeHomeworks,
             alarmMinutes, calendarName } */
  function buildICS(opt) {
    opt = opt || {};
    var now = opt.now || new Date();
    var kids = opt.kids || [];
    var lines = [];
    var kidName = function (id) {
      var k = kids.filter(function (x) { return x.id === id; })[0];
      return k ? k.name : '';
    };

    lines.push('BEGIN:VCALENDAR');
    lines.push('VERSION:2.0');
    lines.push('PRODID:-//아이별 학원 숙제 관리//KO');
    lines.push('CALSCALE:GREGORIAN');
    lines.push('METHOD:PUBLISH');
    lines.push('X-WR-CALNAME:' + icsEscape(opt.calendarName || '아이별 학원 일정'));
    lines.push('X-WR-TIMEZONE:Asia/Seoul');

    if (opt.includeClasses !== false) {
      (opt.classes || []).forEach(function (c) {
        var days = (c.days || []).slice().sort(function (a, b) { return a - b; });
        if (!days.length) return;
        var first = null;
        for (var i = 0; i < 8 && !first; i++) {
          var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
          if (days.indexOf(dayIndex(d)) >= 0) first = d;
        }
        if (!first) return;
        var b = classBounds(c, first);
        var kid = kidName(c.kidId);
        var summary = (kid ? '[' + kid + '] ' : '') + (c.name || '학원');
        var desc = [kid, c.place, c.memo].filter(Boolean).join(' · ');
        lines.push('BEGIN:VEVENT');
        lines.push('UID:' + c.id + '@academy-manager');
        lines.push('DTSTAMP:' + utcStamp(now));
        if (b.allDay) {
          lines.push('DTSTART;VALUE=DATE:' + ymdCompact(b.start));
          lines.push('DTEND;VALUE=DATE:' + ymdCompact(b.end));
        } else {
          lines.push('DTSTART:' + utcStamp(b.start));
          lines.push('DTEND:' + utcStamp(b.end));
        }
        lines.push('RRULE:FREQ=WEEKLY;BYDAY=' + days.map(function (i) { return ICS_BYDAY[i - 1]; }).join(','));
        lines.push('SUMMARY:' + icsEscape(summary));
        if (desc) lines.push('DESCRIPTION:' + icsEscape(desc));
        if (c.place) lines.push('LOCATION:' + icsEscape(c.place));
        var lead = Number(opt.alarmMinutes);
        if (lead > 0 && !b.allDay) {
          lines.push('BEGIN:VALARM');
          lines.push('TRIGGER:-PT' + lead + 'M');
          lines.push('ACTION:DISPLAY');
          lines.push('DESCRIPTION:' + icsEscape(summary));
          lines.push('END:VALARM');
        }
        lines.push('END:VEVENT');
      });
    }

    if (opt.includeHomeworks !== false) {
      (opt.homeworks || []).forEach(function (h) {
        if (h.done) return;
        var d = parseDateKey(h.due);
        if (!d) return;
        var kid = kidName(h.kidId);
        var summary = '[숙제] ' + (h.title || '') + (kid ? ' (' + kid + ')' : '');
        var desc = [kid, h.className, h.memo].filter(Boolean).join(' · ');
        lines.push('BEGIN:VEVENT');
        lines.push('UID:hw-' + h.id + '@academy-manager');
        lines.push('DTSTAMP:' + utcStamp(now));
        lines.push('DTSTART;VALUE=DATE:' + ymdCompact(d));
        lines.push('DTEND;VALUE=DATE:' + ymdCompact(new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)));
        lines.push('SUMMARY:' + icsEscape(summary));
        if (desc) lines.push('DESCRIPTION:' + icsEscape(desc));
        lines.push('TRANSP:TRANSPARENT');
        lines.push('END:VEVENT');
      });
    }

    lines.push('END:VCALENDAR');
    return lines.map(foldLine).join('\r\n') + '\r\n';
  }

  var api = {
    DAY_LABELS: DAY_LABELS,
    DAY_LONGS: DAY_LONGS,
    pad2: pad2,
    dateKey: dateKey,
    parseDateKey: parseDateKey,
    startOfDay: startOfDay,
    dayIndex: dayIndex,
    dayLabel: dayLabel,
    dayLong: dayLong,
    hhmmToMinutes: hhmmToMinutes,
    minutesToHHMM: minutesToHHMM,
    hhmmOf: hhmmOf,
    clockText: clockText,
    rangeText: rangeText,
    atTime: atTime,
    diffDays: diffDays,
    monthDay: monthDay,
    dateLongText: dateLongText,
    weekStart: weekStart,
    weekDates: weekDates,
    classOn: classOn,
    classBounds: classBounds,
    classStatus: classStatus,
    nextClass: nextClass,
    todaysClasses: todaysClasses,
    dueInfo: dueInfo,
    sortHomeworks: sortHomeworks,
    icsEscape: icsEscape,
    foldLine: foldLine,
    buildICS: buildICS
  };

  global.AcademyLogic = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
