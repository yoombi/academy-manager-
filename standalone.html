  /* ================= 시트 ================= */

  function renderSheet() {
    var root = document.getElementById('modalRoot');
    if (!root) return;
    if (!state.sheet) {
      root.innerHTML = '';
      document.body.classList.remove('sheet-open');
      return;
    }
    document.body.classList.add('sheet-open');
    var t = state.sheet.type;
    if (t === 'pin') root.innerHTML = sheetPin();
    else if (t === 'ics') root.innerHTML = sheetICS();
    else if (t === 'kid') root.innerHTML = sheetKid(state.sheet.id);
    else if (t === 'class') root.innerHTML = sheetClass(state.sheet.id);
    else if (t === 'routine') root.innerHTML = sheetRoutine(state.sheet.id);
    else root.innerHTML = sheetHomework(state.sheet.id);
  }

  function sheetReadOnly() { return !!(state.sheet && state.sheet.readOnly); }

  function sheetShell(type, title, body, id) {
    var ro = sheetReadOnly();
    return '<div class="sheet-wrap" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="backdrop" data-action="close-sheet"></div>' +
      '<form class="sheet" data-type="' + type + '" novalidate>' +
      '<div class="handle" aria-hidden="true"></div>' +

      '<p class="form-err" role="alert"></p>' +
      (ro
        ? '<div class="row-note locked-note">🔒 보기 전용이에요. 일정을 고치려면 관리자 비밀번호가 필요해요.</div>' +
          '<div class="sheet-actions">' +

  function chipGroup(name, values, selected, multi) {
    return '<div class="chips" data-multi="' + (multi ? '1' : '0') + '">' + values.map(function (v) {

  /* ---------- 캘린더(.ics) 불러오기 ---------- */

  /* 새로 넣을 아이의 기본값: 고른 아이 → 아이가 하나면 그 아이 → 아이가 없으면 ‘new’ */
  function defaultImportKid() {
    var kids = state.data.kids;
    if (!kids.length) return 'new';
    if (state.kid !== 'all' && kidById(state.kid)) return state.kid;
    return kids[0].id;
  }

  /* 미리보기 한 줄 설명: “월/수 16:00~17:30” / 단발이면 “11/25(수) 15:00~15:50” */
  function icsWhenText(it) {
    var timeText = it.allDay ? '종일' : (it.start ? it.start + '~' + it.end : '시간 미정');
    if (!it.recurring && it.date) {
      var p = String(it.date).split('-');
      var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      return L.monthDay(d) + '(' + L.dayLabel(L.dayIndex(d)) + ') ' + timeText;
    }
    return (it.days || []).map(L.dayLabel).join('/') + ' ' + timeText;
  }

  /* 지금 데이터와 견줘 ‘이미 있는 일정’ 표시를 다시 계산한다.
     중복 건너뛰기가 켜져 있으면 중복된 줄의 체크를 저절로 풀고,
     중복이 아니게 되면(아이를 바꾸는 등) 저절로 되살린다. */
  function refreshIcsDuplicates() {
    var s = state.sheet;
    if (!s || s.type !== 'ics') return;
    s.items.forEach(function (it) {
      var kidId = it.kidId || (s.kidTarget === 'new' ? '' : s.kidTarget);
      var dup = L.classDuplicates(state.data.classes, {
        kidId: kidId, name: it.title, days: it.days, start: it.start, end: it.end
      });
      it.dupAll = dup.all;
      it.dupDays = dup.covered;
      if (s.skipDup) {
        if (it.dupAll && it.checked) { it.checked = false; it.autoOff = true; }
        else if (!it.dupAll && it.autoOff) { it.checked = true; it.autoOff = false; }
      }
    });
  }

  /* .ics 본문을 읽어 미리보기 시트를 연다 */
  function openIcsSheet(text, fileName) {
    var parsed = L.parseICS(text, { now: new Date() });
    if (!parsed.items.length) {
      toast(parsed.skippedHomeworks
        ? '숙제 마감만 든 파일이에요. 학원 일정이 있는 .ics 파일을 골라 주세요.'
        : (parsed.total ? '이 파일에서 넣을 학원 일정을 찾지 못했어요.' : '.ics 파일을 읽지 못했어요.'));
      return false;
    }
    var byName = {};
    state.data.kids.forEach(function (k) { byName[String(k.name).trim()] = k.id; });

    state.sheet = {
      type: 'ics',
      fileName: String(fileName || '.ics'),
      items: parsed.items.map(function (it) {
        return Object.assign({}, it, {
          /* 파일 속 “[아이 이름]”이 지금 등록된 아이와 같으면 그 아이에게 넣는다 */
          kidId: it.kidHint && byName[it.kidHint] ? byName[it.kidHint] : '',
          checked: true,
          autoOff: false,
          dupAll: false,
          dupDays: []
        });
      }),
      skipDup: true,
      kidTarget: defaultImportKid(),
      newKidName: '',
      err: '',
      info: parsed
    };
    refreshIcsDuplicates();
    renderAll();
    return true;
  }

  function importICSFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      openIcsSheet(String(reader.result || ''), file.name || '.ics');
    };
    reader.onerror = function () { toast('파일을 읽지 못했어요.'); };
    reader.readAsText(file);
  }

  function icsItemRow(it, i) {
    var badge = '';
    if (it.dupAll) badge = '<span class="ics-badge dup">이미 있음</span>';
    else if (it.dupDays && it.dupDays.length) {
      badge = '<span class="ics-badge dup">' + esc(it.dupDays.map(L.dayLabel).join('·')) + '요일은 이미 있음</span>';
    }
    if (!it.recurring) badge += '<span class="ics-badge">단발</span>';
    return '<li class="ics-row' + (it.checked ? ' on' : '') + '">' +
      '<button type="button" class="check' + (it.checked ? ' on' : '') + '" data-action="ics-toggle-item" data-i="' + i + '"' +
      ' role="checkbox" aria-checked="' + (it.checked ? 'true' : 'false') + '"' +
      ' aria-label="' + esc(it.title) + ' 넣기">' + (it.checked ? '✓' : '') + '</button>' +
      '<button type="button" class="ics-main" data-action="ics-toggle-item" data-i="' + i + '">' +
      '<span class="ics-name">' + esc(it.title) + '</span>' +
      '<span class="ics-meta">' + esc(icsWhenText(it)) + (it.place ? ' · ' + esc(it.place) : '') + '</span>' +
      (it.kidId || badge
        ? '<span class="ics-tags">' + (it.kidId ? kidTag(it.kidId) : '') + badge + '</span>'
        : '') +
      '</button></li>';
  }

  function sheetICS() {
    var s = state.sheet;
    var items = s.items || [];
    var picked = items.filter(function (it) { return it.checked; }).length;
    var info = s.info || {};
    var hinted = items.some(function (it) { return !!it.kidId; });

    var kidBlock;
    if (!state.data.kids.length) {
      kidBlock = '<label class="field"><span class="field-label">새 아이 이름 <span class="hint">아직 등록된 아이가 없어요</span></span>' +
        '<input class="input" data-ics-newkid="1" value="' + esc(s.newKidName) + '" placeholder="예: 첫째" maxlength="12" autocomplete="off"></label>';
    } else if (state.data.kids.length === 1) {
      var only = state.data.kids[0];
      kidBlock = '<div class="field"><span class="field-label">넣을 시간표</span><div class="chips">' +
        '<span class="chip on">' + esc(only.emoji + ' ' + only.name) + '</span></div></div>';
    } else {
      kidBlock = '<div class="field"><span class="field-label">어느 아이 시간표에 넣을까요</span><div class="chips">' +
        state.data.kids.map(function (k) {
          return '<button type="button" class="chip' + (s.kidTarget === k.id ? ' on' : '') + '"' +
            ' data-action="ics-pick-kid" data-kid="' + k.id + '">' + esc(k.emoji + ' ' + k.name) + '</button>';
        }).join('') + '</div></div>';
    }

    var notes = '';
    if (info.skippedHomeworks) {
      notes += '<p class="hint-line">숙제 마감 ' + info.skippedHomeworks + '개는 학원 일정이 아니라 뺐어요.</p>';
    }
    if (info.duplicates) {
      notes += '<p class="hint-line">같은 일정이 여러 번 있어 ' + info.duplicates + '개는 하나로 합쳤어요.</p>';
    }
    if (info.truncated) {
      notes += '<p class="hint-line">일정이 너무 많아 앞의 ' + items.length + '개만 보여 드려요.</p>';
    }

    return '<div class="sheet-wrap" role="dialog" aria-modal="true" aria-label="캘린더에서 불러오기">' +
      '<div class="backdrop" data-action="close-sheet"></div>' +
      '<div class="sheet ics-sheet">' +
      '<div class="handle" aria-hidden="true"></div>' +
      '<h2 class="sheet-title">📅 캘린더에서 불러오기</h2>' +
      '<p class="card-desc">' + esc(s.fileName) + ' 에서 일정 ' + items.length + '개를 찾았어요. 시간표에 넣을 일정만 골라 주세요.</p>' +
      '<p class="ics-guide"><b>구글 캘린더에서 .ics 받는 3단계</b><br>' +
      '① 구글 캘린더 웹 → ⚙️ 설정<br>' +
      '② 가져오기 및 내보내기 → 내보내기<br>' +
      '③ 내려받은 .ics 파일을 여기서 고르기 (zip 이면 풀어서)</p>' +
      kidBlock +
      (hinted ? '<p class="hint-line">이름표 “[아이 이름]”가 붙은 일정은 그 아이에게 들어가요.</p>' : '') +
      notes +
      '<div class="ics-list-head"><b>넣을 일정 ' + picked + '/' + items.length + '</b>' +
      '<button type="button" class="btn tiny ghost" data-action="ics-toggle-all">' + (picked ? '모두 해제' : '모두 선택') + '</button></div>' +
      '<ul class="ics-list">' + items.map(icsItemRow).join('') + '</ul>' +
      '<div class="setting"><span class="setting-label">이미 있는 일정은 건너뛰기</span>' +
      '<button type="button" class="switch' + (s.skipDup ? ' on' : '') + '" role="switch" aria-checked="' + (s.skipDup ? 'true' : 'false') + '"' +
      ' aria-label="중복 건너뛰기" data-action="ics-skip-dup"><span></span></button></div>' +
      (s.err ? '<p class="form-err show" role="alert">' + esc(s.err) + '</p>' : '') +
      '<div class="sheet-actions">' +
      '<button type="button" class="btn ghost" data-action="close-sheet">취소</button>' +
      '<button type="button" class="btn primary" data-action="ics-apply">' +
      (picked ? picked + '개 시간표에 넣기' : '넣을 일정을 골라 주세요') + '</button>' +
      '</div></div></div>';
  }

  /* 고른 일정을 학원 일정으로 저장한다 */
  function applyIcsImport() {
    var s = state.sheet;
    if (!s || s.type !== 'ics') return { ok: false, error: 'none' };
    /* 혹시 시트를 연 사이 잠겼다면 다시 PIN 을 받는다 */
    if (lockRequired()) { openPinSheet('unlock', function () { renderAll(); }); return { ok: false, error: 'locked' }; }

    var chosen = (s.items || []).filter(function (it) { return it.checked; });
    if (!chosen.length) {
      s.err = '넣을 일정을 하나 이상 골라 주세요.';
      renderAll();
      return { ok: false, error: 'empty' };
    }

    var targetKid = s.kidTarget;
    if (!state.data.kids.length || targetKid === 'new') {
      var name = String(s.newKidName || '').trim();
      if (!name) {
        s.err = '새 아이 이름을 입력해 주세요.';
        renderAll();
        return { ok: false, error: 'nokid' };
      }
      var created = upsertKid({ name: name });
      if (!created.ok) {
        s.err = created.error;
        renderAll();
        return { ok: false, error: 'nokid' };
      }
      targetKid = created.kid.id;
    }
    if (!kidById(targetKid)) {
      s.err = '일정을 넣을 아이를 골라 주세요.';
      renderAll();
      return { ok: false, error: 'nokid' };
    }

    var added = 0, skipped = 0, partial = 0, failed = 0;
    var kidIds = {};
    chosen.forEach(function (it) {
      var kidId = it.kidId || targetKid;
      var days = (it.days || []).slice();
      if (s.skipDup) {
        var dup = L.classDuplicates(state.data.classes, {
          kidId: kidId, name: it.title, days: days, start: it.start, end: it.end
        });
        if (dup.all) { skipped += 1; return; }
        if (dup.rest.length && dup.rest.length < days.length) { days = dup.rest; partial += 1; }
      }
      if (!days.length) { skipped += 1; return; }
      var res = upsertClass({
        kidId: kidId,
        name: it.title,
        days: days,
        start: it.start || '',
        end: it.end || '',
        place: it.place || '',
        memo: it.memo || ''
      });
      if (res.ok) { added += 1; kidIds[kidId] = true; } else failed += 1;
    });

    var msg = added ? '일정 ' + added + '개를 시간표에 넣었어요' : '새로 넣을 일정이 없었어요';
    if (skipped) msg += ' (이미 있어서 ' + skipped + '개 건너뜀)';
    if (failed) msg += ' · ' + failed + '개는 넣지 못했어요';
    if (partial) msg += ' · ' + partial + '개는 겹치지 않는 요일만 넣었어요';

    state.sheet = null;
    state.view = 'schedule';
    var kidsTouched = Object.keys(kidIds);
    state.kid = kidsTouched.length === 1 ? kidsTouched[0] : 'all';
    renderAll();
    toast(msg);
    return { ok: true, added: added, skipped: skipped, failed: failed, partial: partial };
  }

  /* ---------- 관리자 비밀번호(PIN) 입력 ---------- */

  function openPinSheet(mode, after) {
    state.sheet = {
      type: 'pin',
      mode: mode === 'set' ? 'set' : 'unlock',
      stage: mode === 'set' ? 'new' : 'unlock',
      buf: '',
      first: '',
      err: '',
      help: false,
      after: typeof after === 'function' ? after : null
    };
    renderAll();
  }

  function pinDots(buf) {
    var out = '';
    for (var i = 0; i < 4; i++) out += '<span class="pin-dot' + (i < buf.length ? ' on' : '') + '"></span>';
    return '<div class="pin-dots" aria-label="' + buf.length + '자리 입력됨">' + out + '</div>';
  }

  function pinPad() {
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'blank', '0', 'del'];
    return '<div class="pin-pad">' + keys.map(function (k) {
      if (k === 'blank') return '<span class="pin-key pin-key-blank" aria-hidden="true"></span>';
      if (k === 'del') return '<button type="button" class="pin-key pin-key-fn" data-action="pin-key" data-key="del" aria-label="지우기">⌫</button>';
      return '<button type="button" class="pin-key" data-action="pin-key" data-key="' + k + '">' + k + '</button>';
    }).join('') + '</div>';
  }

  function sheetPin() {
    var s = state.sheet;
    var setMode = s.mode === 'set';
    var confirming = setMode && s.stage === 'confirm';
    var title = setMode
      ? (confirming ? '비밀번호 한 번 더' : (hasPin() ? '새 관리자 비밀번호' : '관리자 비밀번호 만들기'))
      : '관리자 비밀번호 입력';
    var desc = setMode
      ? (confirming ? '같은 4자리 숫자를 한 번 더 눌러 주세요.'
        : '아이가 함부로 바꾸지 않도록 잠글 4자리 숫자를 정해 주세요. (예: 기억하기 쉬운 생일·기념일)')
      : '설정이나 일정을 고치려면 4자리 비밀번호를 입력해 주세요.';
    var blockLeft = Math.ceil(Math.max(0, state.pinBlockUntil - Date.now()) / 1000);

    return '<div class="sheet-wrap" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="backdrop" data-action="close-sheet"></div>' +
      '<div class="sheet pin-sheet">' +
      '<div class="handle" aria-hidden="true"></div>' +
      '<h2 class="sheet-title">🔒 ' + title + '</h2>' +
      '<p class="card-desc">' + desc + '</p>' +
      pinDots(s.buf) +
      '<p class="pin-err' + (s.err ? ' show' : '') + '" role="alert">' + esc(s.err || '') + '</p>' +
      '<p class="pin-wait' + (blockLeft > 0 ? ' show' : '') + '">' + (blockLeft > 0 ? blockLeft + '초 뒤에 다시 시도할 수 있어요.' : '') + '</p>' +
      pinPad() +
      '<div class="sheet-actions">' +
      '<button type="button" class="btn ghost" data-action="close-sheet">취소</button>' +
      (confirming
        ? '<button type="button" class="btn ghost" data-action="pin-restart">처음부터</button>'
        : (setMode ? '' : '<button type="button" class="btn ghost" data-action="pin-forgot">비밀번호를 잊었어요</button>')) +
      '</div>' +
      (s.help
        ? '<div class="pin-help">' +
          '<p>비밀번호는 이 기기에 해시로만 저장돼서 찾아낼 수 없어요. 잊었다면 <b>이 기기의 앱 데이터를 초기화</b>한 뒤, 미리 저장해 둔 백업 파일을 불러와 주세요. (백업을 불러오면 잠금이 풀린 상태로 시작합니다.)</p>' +
          '<button type="button" class="btn ghost danger block" data-action="reset-from-lock">이 기기 데이터 초기화</button>' +
          '</div>'
        : '') +
      '</div></div>';
  }

  function submitPin() {
    var s = state.sheet;
    if (!s || s.type !== 'pin') return;
    var pin = String(s.buf || '');
    if (pin.length !== 4) return;

    if (s.mode === 'set') {
      if (s.stage === 'new') {
        s.first = pin;
        s.stage = 'confirm';
        s.buf = '';
        s.err = '';
        renderAll();
        return;
      }
      if (pin === s.first) {
        setPin(pin);
        state.sheet = null;
        renderAll();
        toast('관리자 비밀번호를 설정했어요. 체크·보기는 그대로, 일정 수정만 잠깁니다');
        return;
      }
      s.stage = 'new';
      s.first = '';
      s.buf = '';
      s.err = '두 번 입력한 번호가 달라요. 처음부터 다시 눌러 주세요.';
      renderAll();
      return;
    }

    if (state.pinBlockUntil > Date.now()) {
      s.buf = '';
      s.err = '';
      renderAll();
      return;
    }
    if (verifyPin(pin)) {
      var after = s.after;
      state.sheet = null;
      renderAll();
      if (typeof after === 'function') after();
      else toast('관리자 잠금을 풀었어요');
      return;
    }
    s.buf = '';
    s.err = state.pinBlockUntil > Date.now()
      ? '5번 틀렸어요. 30초 뒤에 다시 시도해 주세요.'
      : '비밀번호가 맞지 않아요. (' + state.pinFails + '/5)';
    renderAll();
  }

  /* ---------- 렌더 ---------- */

  function renderLockBtn() {
    var btn = document.getElementById('lockBtn');
    if (!btn) return;
    var on = hasPin();
    var locked = on && !state.unlocked;
    btn.hidden = !on;
    btn.textContent = locked ? '🔒' : '🔓';
    btn.setAttribute('aria-label', locked ? '관리자 잠금 풀기' : '관리자 잠금 걸기');
    btn.setAttribute('aria-pressed', locked ? 'true' : 'false');
    btn.title = locked ? '관리자 잠금 풀기' : '관리자 잠금 걸기';
  }

  function renderAll() {
    var today = document.getElementById('todayLine');
    if (today) today.textContent = headerLine();
    var kidBar = document.getElementById('kidBar');
    if (kidBar) kidBar.innerHTML = renderKidBar();
    var main = document.getElementById('main');
    if (main) main.innerHTML = renderMain();
    var tabBar = document.getElementById('tabBar');
    if (tabBar) tabBar.innerHTML = renderTabBar();
    renderLockBtn();
    renderGrid();
    renderSheet();
  }

  /* ================= 시트 동작 ================= */

  function openSheet(type, id) {
    if (!state.data.kids.length && type !== 'kid') {
      toast('먼저 아이를 추가해 주세요.');
      type = 'kid';
      id = null;
    }
    state.sheet = { type: type, id: id || null };
    renderAll();
    var input = document.querySelector('.sheet input, .sheet select');
    if (input && input.focus) setTimeout(function () { try { input.focus(); } catch (e) {} }, 80);
  }

  function closeSheet() {
    state.sheet = null;
    renderAll();
  }

  function pickedValues(form, group) {
    var nodes = form.querySelectorAll('[data-pickgroup="' + group + '"].on');
    return Array.prototype.map.call(nodes, function (n) { return n.getAttribute('data-value'); });
  }

  function fieldValue(form, name) {
    var el = form.querySelector('[name="' + name + '"]');
    return el ? el.value : '';
  }

  function showFormError(form, message) {
    var box = form.querySelector('.form-err');
    if (!box) return;
    box.textContent = message || '';
    box.classList.toggle('show', !!message);
  }

  function submitSheet(form) {
    var type = form.getAttribute('data-type');
    var id = state.sheet ? state.sheet.id : null;
    var result;

    /* 잠금이 걸린 뒤 Enter 로 폼이 넘어오는 경우를 막는다 */
    if (lockRequired()) {
      var pending = state.sheet ? { type: state.sheet.type, id: state.sheet.id } : null;
      showFormError(form, '관리자 비밀번호가 필요해요.');
      openPinSheet('unlock', function () {
        if (pending) state.sheet = { type: pending.type, id: pending.id };
        renderAll();
      });
      return;
    }
    if (type === 'kid') {
      result = upsertKid({
        id: id,
        name: fieldValue(form, 'name'),
        color: pickedValues(form, 'color')[0],
        emoji: pickedValues(form, 'emoji')[0]
      });
    } else if (type === 'class') {
      result = upsertClass({
        id: id,
        kidId: fieldValue(form, 'kidId'),
        name: fieldValue(form, 'name'),
        days: pickedValues(form, 'day'),
        start: fieldValue(form, 'start'),
        end: fieldValue(form, 'end'),
        place: fieldValue(form, 'place'),
        memo: fieldValue(form, 'memo')
      });
    } else if (type === 'routine') {
      result = upsertRoutine({
        id: id,
        kidId: fieldValue(form, 'kidId'),
        title: fieldValue(form, 'title'),
        days: pickedValues(form, 'day'),
        time: fieldValue(form, 'time'),
        memo: fieldValue(form, 'memo')
      });
    } else {
      result = upsertHomework({
        id: id,
        kidId: fieldValue(form, 'kidId'),
        classId: fieldValue(form, 'classId'),
        title: fieldValue(form, 'title'),
        due: fieldValue(form, 'due'),
        memo: fieldValue(form, 'memo')
      });
    }

    if (!result.ok) {
      showFormError(form, result.error);
      return;
    }
    state.sheet = null;
    if (type === 'kid' && !id && result.kid) state.kid = result.kid.id;
    renderAll();
    toast(type === 'kid' ? '아이를 저장했어요'
      : type === 'class' ? '학원 일정을 저장했어요'
        : type === 'routine' ? '할 일을 저장했어요' : '숙제를 저장했어요');
  }

  /* ================= 알림 ================= */

  function isFileMode() {
    return !!(window.location && window.location.protocol === 'file:');
  }

  function notificationPermission() {
    if (typeof window.Notification === 'undefined') return 'unsupported';
    return window.Notification.permission;
  }

  function showNotification(title, body, tag) {
    if (notificationPermission() !== 'granted') return false;
    if (state.swReg && state.swReg.showNotification) {
      try {
        state.swReg.showNotification(title, { body: body, tag: tag, icon: 'icon-192.png', badge: 'icon-192.png' });
        return true;
      } catch (e) { /* 기본 방식 시도 */ }
    }
    try {
      new window.Notification(title, { body: body, tag: tag, icon: 'icon-192.png' });
      return true;
    } catch (e) {
      toast(title + ' — ' + body);
      return false;
    }
  }

  function afterPermission(result) {
    renderAll();
    if (result === 'granted') {
      toast('알림을 켰어요');
      showNotification('알림이 켜졌어요', '학원 시작과 숙제 마감을 알려드릴게요.', 'welcome');
    } else if (result === 'denied') {
      toast('알림이 차단됐어요. 브라우저 설정에서 허용해 주세요.');
    }
  }

  function requestPermission() {
    if (typeof window.Notification === 'undefined') {
      toast('이 브라우저는 알림을 지원하지 않아요.');
      return;
    }
    try {
      var p = window.Notification.requestPermission(function (result) { afterPermission(result); });
      if (p && p.then) p.then(afterPermission).catch(function () {});
    } catch (e) {
      toast('알림 권한을 요청하지 못했어요.');
    }
  }

  function testNotification() {
    if (notificationPermission() === 'granted') {
      if (!showNotification('테스트 알림', '이렇게 알려드릴게요. 잘 보이시나요?', 'test')) {
        toast('알림을 표시하지 못했어요.');
      }
    } else if (notificationPermission() === 'denied') {
      toast('알림이 차단되어 있어요. 브라우저 설정에서 허용해 주세요.');
    } else {
      requestPermission();
    }
  }

  function pruneFired(now) {
    var limit = now.getTime() - 7 * 86400000;
    var fired = state.data.fired || {};
    Object.keys(fired).forEach(function (key) {
      if (Number(fired[key]) < limit) delete fired[key];
    });
  }

  function pruneChecks() {
    var limit = L.dateKey(new Date(Date.now() - 30 * 86400000));
    var checks = state.data.checks || {};
    Object.keys(checks).forEach(function (key) {
      var day = key.split('|')[1];
      if (!day || day < limit) delete checks[key];
    });
  }

  function checkNotifications() {
    if (notificationPermission() !== 'granted') return;
    var now = new Date();
    var today = L.dateKey(now);
    var s = state.data.settings;
    var fired = state.data.fired || (state.data.fired = {});
    var changed = false;

    if (s.notifyClass) {
      var lead = Math.max(0, Number(s.classLeadMin) || 0) * 60000;
      state.data.classes.forEach(function (c) {
        if (L.hhmmToMinutes(c.start) == null) return;
        if ((c.days || []).indexOf(L.dayIndex(now)) < 0) return;
        var b = L.classBounds(c, now);
        var key = 'cls:' + c.id + ':' + today;
        var from = new Date(b.start.getTime() - lead);
        if (!fired[key] && now >= from && now < b.start) {
          fired[key] = now.getTime();
          changed = true;
          var kid = kidById(c.kidId);
          var mins = Math.round(lead / 60000);
          showNotification(
            (kid ? kid.name + ' ' : '') + c.name,
            L.clockText(c.start) + ' 시작' + (mins > 0 ? ' · ' + mins + '분 남았어요' : '') + (c.place ? ' · ' + c.place : ''),
            key
          );
        }
      });
    }

    if (s.notifyHomework) {
      var hm = /^(\d{1,2}):(\d{2})$/.exec(String(s.homeworkTime || '20:00'));
      var at = new Date(now.getFullYear(), now.getMonth(), now.getDate(),
        hm ? Number(hm[1]) : 20, hm ? Number(hm[2]) : 0, 0, 0);
      if (now >= at) {
        state.data.homeworks.filter(function (h) { return !h.done && h.due === today; }).forEach(function (h) {
          var key = 'hw:' + h.id + ':' + h.due;
          if (!fired[key]) {
            fired[key] = now.getTime();
            changed = true;
            var kid = kidById(h.kidId);
            showNotification('오늘 마감 숙제', (kid ? kid.name + ' · ' : '') + h.title, key);
          }
        });
      }
    }

    if (changed) {
      pruneFired(now);
      save();
    }
  }

  /* ================= 주기 갱신 ================= */

  function updateLive() {
    var now = new Date();
    var nodes = document.querySelectorAll('[data-live]');
    Array.prototype.forEach.call(nodes, function (el) {
      var parts = (el.getAttribute('data-live') || '').split(':');
      if (parts[0] === 'cls') {
        var c = classById(parts[1]);
        if (c) el.textContent = liveText(c, now);
      }
    });
  }

  function tick() {
    var today = L.dateKey(new Date());
    if (state.dayKey !== today) {
      state.dayKey = today;
      renderAll();
    } else {
      updateLive();
      var line = document.getElementById('todayLine');
      if (line) line.textContent = headerLine();
    }
    autoLockCheck();
    checkNotifications();
  }

  /* ================= 파일 내보내기 ================= */

  function download(text, filename, mime) {
    try {
      var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        try { URL.revokeObjectURL(url); a.remove(); } catch (e) {}
      }, 1500);
      return true;
    } catch (e) {
      toast('파일을 만들지 못했어요.');
      return false;
    }
  }

  function exportJSON() {
    var payload = { app: 'academy-manager', version: 1, exportedAt: new Date().toISOString(), data: state.data };
    if (download(JSON.stringify(payload, null, 2), '엄마다했쏙-백업-' + L.dateKey(new Date()) + '.json', 'application/json;charset=utf-8')) {
      toast('백업 파일을 저장했어요');
    }
  }

  function importJSONFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var parsed = JSON.parse(String(reader.result));
        var raw = parsed && parsed.data ? parsed.data : parsed;
        if (!raw || !Array.isArray(raw.kids)) throw new Error('format');
        var next = normalizeData(raw);
        if (!window.confirm('불러온 백업으로 현재 데이터를 바꿀까요?\n(아이 ' + next.kids.length + '명 · 학원 ' + next.classes.length +
          '개 · 할 일 ' + next.routines.length + '개 · 숙제 ' + next.homeworks.length + '개)')) return;
        state.data = next;
        state.kid = 'all';
        /* 불러온 사람을 관리자로 본다 — 백업에 잠금이 들어 있어도 이번 화면에서는 풀린 상태로 둔다 */
        state.unlocked = true;
        save();
        renderAll();
        toast(next.lock && next.lock.hash
          ? '백업을 불러왔어요. 관리자 비밀번호도 함께 복원됐어요'
          : '백업을 불러왔어요');
      } catch (e) {
        toast('백업 파일을 읽을 수 없어요.');
      }
    };
    reader.onerror = function () { toast('파일을 읽지 못했어요.'); };
    reader.readAsText(file);
  }

  function exportICS(scope) {
    var now = new Date();
    var classes = scopedClasses();
    var works = scopedHomeworks().map(function (h) {
      var c = h.classId ? classById(h.classId) : null;
      return Object.assign({}, h, { className: c ? c.name : '' });
    });
    var only = scope || 'all';
    var label = only === 'classes' ? '학원일정' : only === 'homework' ? '숙제마감' : '일정전체';
    var scopeName = state.kid === 'all' ? '전체' : ((kidById(state.kid) || {}).name || '');
    var ics = L.buildICS({
      kids: state.data.kids,
      classes: only === 'homework' ? [] : classes,
      homeworks: only === 'classes' ? [] : works,
      now: now,
      alarmMinutes: state.data.settings.notifyClass ? state.data.settings.classLeadMin : 0,
      calendarName: '엄마다했쏙 일정 (' + scopeName + ')'
    });
    if (download(ics, '엄마다했쏙-' + label + '-' + L.dateKey(now) + '.ics', 'text/calendar;charset=utf-8')) {
      toast('.ics 파일을 저장했어요. 파일을 눌러 캘린더에 추가하세요.');
    }
  }

  /* ================= 예시 계획표 (익명 샘플) ================= */

  function buildSampleData() {
    var kids = [
      { id: uid('kid'), name: '첫째', color: '#6366f1', emoji: '🦊' },

    };

      /* 둘째 */

      cls(B, '영어학원', [2, 4], '16:00', '17:00'),

    ];

    var routines = [
      /* 첫째 */
      rt(A, '숙제 확인', [1, 2, 3, 4, 5], '19:00~20:00'),

      rt(A, '주말 독서', [6], ''),
      /* 둘째 */
      rt(B, '숙제 확인', [1, 2, 3, 4, 5], '19:00~20:00'),

    ];

    return {
      version: 1,
      kids: kids,
      classes: classes,
      routines: routines,
      homeworks: [],
      checks: {},
      settings: defaultSettings(),
      fired: {},
      createdAt: new Date().toISOString()
    };
  }

  function loadSamplePlan() {
    if (state.data.kids.length) {
      if (!window.confirm('예시 계획표로 바꿀까요?\n지금 입력한 아이·학원·할 일·숙제가 모두 바뀝니다.')) return;

  function resetAll() {
    if (!window.confirm('모든 데이터를 삭제할까요?\n아이·학원·할 일·숙제 기록이 모두 지워집니다.')) return;
    state.data = blankData();

    state.view = 'today';

  /* 비밀번호를 잊었을 때 — 이 기기 데이터를 초기화(잠금까지 함께 사라짐)하고 백업으로 복원 */
  function resetFromLockScreen() {
    if (!window.confirm('이 기기의 앱 데이터를 모두 지울까요?\n아이·학원·할 일·숙제·관리자 비밀번호가 함께 지워집니다. 되돌릴 수 없어요.')) return;
    var typed = '';
    try { typed = String(window.prompt('정말 초기화하려면 “초기화”를 입력해 주세요.', '') || ''); } catch (e) { typed = ''; }
    if (typed.trim() !== '초기화') {
      toast('입력한 내용이 달라 초기화하지 않았어요');
      return;
    }
    state.data = blankData();
    state.kid = 'all';
    state.view = 'today';
    state.sheet = null;
    state.unlocked = true;
    save();
    renderAll();
    toast('앱 데이터를 초기화했어요. 백업 파일이 있으면 불러와 주세요');
  }

  /* ================= 이벤트 ================= */

  function handleClick(event) {
    var target = event.target;
    if (!target || !target.closest) return;
    markActivity();

    var pick = target.closest('[data-pickgroup]');
    if (pick) {
      var box = pick.closest('.chips');
      var multi = box && box.getAttribute('data-multi') === '1';
      if (multi) {
        pick.classList.toggle('on');
      } else {
        Array.prototype.forEach.call(box.querySelectorAll('[data-pickgroup]'), function (n) { n.classList.remove('on'); });
        pick.classList.add('on');
      }
      return;
    }

    var el = target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');

    switch (action) {
      case 'set-view':
        var nextView = el.getAttribute('data-view');
        if (nextView === 'settings' && lockRequired()) {
          openPinSheet('unlock', function () { state.view = 'settings'; renderAll(); });
          break;
        }
        state.view = nextView;
        renderAll();
        try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { window.scrollTo(0, 0); }
        break;
      case 'set-kid':
        state.kid = el.getAttribute('data-kid') || 'all';
        renderAll();
        break;
      case 'set-hw-filter':
        state.hwFilter = el.getAttribute('data-filter') || 'open';
        renderAll();
        break;
      case 'open-grid':
        /* 보기 전용 — 잠겨 있어도 PIN 없이 연다 */
        openGrid();
        break;
      case 'close-grid':
        closeGrid();
        break;
      case 'grid-kid':
        gridOpts().kid = el.getAttribute('data-kid') || 'all';
        renderAll();
        break;
      case 'grid-zoom':
        var gZoom = gridOpts();
        gZoom.zoom = gZoom.zoom === 'big' ? 'fit' : 'big';
        if (state.data && state.data.settings) { state.data.settings.gridZoom = gZoom.zoom; save(); }
        renderAll();
        break;
      case 'grid-weekend':
        var gOpts = gridOpts();
        var gScoped = gridScope();
        var gWeekend = gScoped.some(function (c) { return (c.days || []).indexOf(6) >= 0 || (c.days || []).indexOf(7) >= 0; });
        var gHidden = gOpts.weekend === 'always' || (gOpts.weekend === 'auto' && !gWeekend);
        gOpts.weekend = gHidden ? 'never' : 'always';
        renderAll();
        break;
      case 'print-grid':
        printGrid();
        break;
      case 'add-kid':
        guardEdit(function () { openSheet('kid', null); });
        break;
      case 'add-class':
        guardEdit(function () { openSheet('class', null); });
        break;
      case 'add-routine':
        guardEdit(function () { openSheet('routine', null); });
        break;
      case 'add-homework':
        guardEdit(function () { openSheet('homework', null); });
        break;
      case 'edit-kid':
        openItemSheet('kid', id);
        break;
      case 'edit-class':
        openItemSheet('class', id);
        break;
      case 'edit-routine':
        openItemSheet('routine', id);
        break;
      case 'edit-hw':
        openItemSheet('homework', id);
        break;
      case 'toggle-hw':
        toggleHomework(id);
        renderAll();
        if (homeworkById(id) && homeworkById(id).done) toast('숙제 완료! 👏');
        break;
      case 'toggle-routine':
        toggleRoutine(id);
        renderAll();
        if (routineById(id) && isRoutineDone(routineById(id), L.dateKey(new Date()))) toast('완료! 👏');
        break;
      case 'toggle-done-in-sheet':
        if (state.sheet && state.sheet.id) {
          toggleHomework(state.sheet.id);
          var updated = homeworkById(state.sheet.id);
          var btn = document.querySelector('.sheet [data-action="toggle-done-in-sheet"]');
          if (btn && updated) {
            btn.classList.toggle('on', updated.done);
            btn.textContent = updated.done ? '✓ 완료됨' : '미완료';
          }
          var line = document.getElementById('todayLine');
          if (line) line.textContent = headerLine();
        }
        break;
      case 'close-sheet':
        closeSheet();
        break;
      case 'delete-item':
        guardEdit(deleteCurrentSheetItem);
        break;
      case 'unlock-edit':
        var viewing = state.sheet;
        openPinSheet('unlock', function () {
          if (viewing) { state.sheet = { type: viewing.type, id: viewing.id, readOnly: false }; renderAll(); }
        });
        break;
      case 'pin-key':
        var sheetPinState = state.sheet;
        if (!sheetPinState || sheetPinState.type !== 'pin') break;
        var digit = el.getAttribute('data-key');
        if (digit === 'del') sheetPinState.buf = String(sheetPinState.buf || '').slice(0, -1);
        else if (/^[0-9]$/.test(digit || '') && String(sheetPinState.buf || '').length < 4) {
          sheetPinState.buf = String(sheetPinState.buf || '') + digit;
        }
        sheetPinState.err = '';
        if (String(sheetPinState.buf || '').length === 4) { submitPin(); break; }
        renderAll();
        break;
      case 'pin-restart':
        if (state.sheet && state.sheet.type === 'pin') {
          state.sheet.stage = 'new';
          state.sheet.first = '';
          state.sheet.buf = '';
          state.sheet.err = '';
          renderAll();
        }
        break;
      case 'pin-forgot':
        if (state.sheet && state.sheet.type === 'pin') {
          state.sheet.help = !state.sheet.help;
          renderAll();
        } else {
          openPinSheet('unlock');
          if (state.sheet && state.sheet.type === 'pin') { state.sheet.help = true; renderAll(); }
        }
        break;
      case 'reset-from-lock':
        resetFromLockScreen();
        break;
      case 'lock-set':
        guardEdit(function () { openPinSheet('set'); });
        break;
      case 'lock-change':
        guardEdit(function () { openPinSheet('set'); });
        break;
      case 'lock-unlock':
        if (!hasPin()) { toast('아직 관리자 비밀번호가 없어요. 설정에서 먼저 만들어 주세요.'); break; }
        openPinSheet('unlock', function () { renderAll(); });
        break;
      case 'lock-now':
        lockNow();
        renderAll();
        break;
      case 'toggle-lock':
        if (!hasPin()) { toast('설정에서 관리자 비밀번호를 먼저 만들어 주세요.'); break; }
        if (lockRequired()) openPinSheet('unlock', function () { renderAll(); });
        else { lockNow(); renderAll(); }
        break;
      case 'lock-off':
        if (!hasPin()) break;
        if (!window.confirm('관리자 비밀번호를 삭제할까요?\n삭제하면 아이도 일정을 고칠 수 있게 됩니다.')) break;
        clearPin();
        renderAll();
        toast('관리자 비밀번호를 삭제했어요');
        break;
      case 'toggle-setting':
        var key = el.getAttribute('data-key');
        state.data.settings[key] = !state.data.settings[key];
        save();
        renderAll();
        if (key === 'notifyClass' && state.data.settings[key] && notificationPermission() === 'default') requestPermission();
        break;
      case 'request-permission':
        requestPermission();
        break;
      case 'test-notify':
        testNotification();
        break;
      case 'export-json':
        exportJSON();
        break;
      case 'import-json':
        var input = document.getElementById('importFile');
        if (input) input.click();
        break;
      case 'export-ics':
        exportICS(el.getAttribute('data-scope'));
        break;
      case 'import-ics':
        guardEdit(function () {
          var icsInput = document.getElementById('icsFile');
          if (icsInput) { try { icsInput.click(); } catch (e) { /* 무시 */ } }
        });
        break;
      case 'ics-toggle-item':
        if (state.sheet && state.sheet.type === 'ics') {
          var icsRow = state.sheet.items[Number(el.getAttribute('data-i'))];
          if (icsRow) { icsRow.checked = !icsRow.checked; state.sheet.err = ''; renderAll(); }
        }
        break;
      case 'ics-toggle-all':
        if (state.sheet && state.sheet.type === 'ics') {
          var anyPicked = state.sheet.items.some(function (it) { return it.checked; });
          state.sheet.items.forEach(function (it) { it.checked = !anyPicked; });
          state.sheet.err = '';
          renderAll();
        }
        break;
      case 'ics-skip-dup':
        if (state.sheet && state.sheet.type === 'ics') {
          state.sheet.skipDup = !state.sheet.skipDup;
          if (state.sheet.skipDup) {
            state.sheet.items.forEach(function (it) {
              if (it.dupAll) { it.checked = false; it.autoOff = true; }
            });
          } else {
            state.sheet.items.forEach(function (it) { it.checked = true; it.autoOff = false; });
          }
          state.sheet.err = '';
          renderAll();
        }
        break;
      case 'ics-pick-kid':
        if (state.sheet && state.sheet.type === 'ics') {
          state.sheet.kidTarget = el.getAttribute('data-kid') || state.sheet.kidTarget;
          state.sheet.err = '';
          refreshIcsDuplicates();
          renderAll();
        }
        break;
      case 'ics-apply':
        applyIcsImport();
        break;
      case 'load-sample':
        guardEdit(loadSamplePlan);
        break;
      case 'reset-all':
        guardEdit(resetAll);
        break;
      case 'install':
        if (state.installEvent) {
          state.installEvent.prompt();
          state.installEvent = null;
          renderAll();
        }
        break;
      default:
        break;
    }
  }

  function deleteCurrentSheetItem() {
    if (!state.sheet || !state.sheet.id) return;
    var type = state.sheet.type;
    var id = state.sheet.id;
    if (type === 'kid') {
      var kid = kidById(id);
      var count = state.data.classes.filter(function (c) { return c.kidId === id; }).length;
      if (!window.confirm('“' + (kid ? kid.name : '') + '”를 삭제할까요?' + (count ? '\n학원 ' + count + '개와 할 일·숙제도 함께 삭제됩니다.' : ''))) return;
      deleteKid(id);
    } else if (type === 'class') {
      var cls = classById(id);
      if (!window.confirm('“' + (cls ? cls.name : '') + '” 일정을 삭제할까요?')) return;
      deleteClass(id);
    } else if (type === 'routine') {
      var r = routineById(id);
      if (!window.confirm('“' + (r ? r.title : '') + '” 할 일을 삭제할까요?')) return;
      deleteRoutine(id);
    } else {
      var hw = homeworkById(id);
      if (!window.confirm('“' + (hw ? hw.title : '') + '” 숙제를 삭제할까요?')) return;
      deleteHomework(id);
    }
    state.sheet = null;
    renderAll();
    toast('삭제했어요');
  }

  function handleSubmit(event) {
    var form = event.target;
    if (!form || !form.matches || !form.matches('form.sheet')) return;
    event.preventDefault();
    submitSheet(form);
  }

  function handleChange(event) {
    var t = event.target;
    if (!t || !t.getAttribute) return;
    var lockKey = t.getAttribute('data-locksetting');
    if (lockKey === 'autoLockMin') {
      setLockAutoMin(t.value);
      renderAll();
      toast('자동 잠금 시간을 바꿨어요');
      return;
    }
    var key = t.getAttribute('data-setting');
    if (key) {
      state.data.settings[key] = t.value;
      save();
      if (key === 'classLeadMin') { renderAll(); toast('알림 시점을 바꿨어요'); }
    }
    if (t.id === 'importFile') {
      importJSONFile(t.files && t.files[0]);
      t.value = '';
    }
    if (t.id === 'icsFile') {
      importICSFile(t.files && t.files[0]);
      t.value = '';
    }
    if (t.getAttribute && t.getAttribute('data-ics-newkid')) {
      if (state.sheet && state.sheet.type === 'ics') {
        state.sheet.newKidName = t.value;
        state.sheet.err = '';
      }
    }
  }

  function handleKeydown(event) {
    markActivity();
    var s = state.sheet;
    if (s && s.type === 'pin' && event.key) {
      if (/^[0-9]$/.test(event.key) && String(s.buf || '').length < 4) {
        s.buf = String(s.buf || '') + event.key;
        s.err = '';
        if (s.buf.length === 4) submitPin();
        else renderAll();
        return;
      }
      if (event.key === 'Backspace' && String(s.buf || '').length) {
        s.buf = String(s.buf).slice(0, -1);
        renderAll();
        return;
      }
    }
    if (event.key === 'Escape' && state.sheet) closeSheet();
    else if (event.key === 'Escape' && state.grid) closeGrid();
  }

  /* ================= 서비스워커 / 설치 ================= */

  function registerSW() {
    if (!('serviceWorker' in navigator)) return;
    var proto = window.location.protocol;
    if (proto !== 'https:' && proto !== 'http:') return;
    try {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
        state.swReg = reg;
      }).catch(function () { /* 오프라인 캐시 없이도 동작 */ });
      navigator.serviceWorker.addEventListener('message', function (ev) {
        if (ev.data && ev.data.type === 'open-homework') {
          state.view = 'homework';
          renderAll();
        }
      });
    } catch (e) { /* 무시 */ }
  }

  /* ================= 토스트 ================= */

  var toastTimer = null;
  function toast(message) {
    var root = document.getElementById('toastRoot');
    if (!root) return;
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = message;
    root.appendChild(el);
    setTimeout(function () { el.classList.add('show'); }, 10);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      el.classList.remove('show');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
    }, 2400);
  }

  /* ================= 시작 ================= */

  var started = false;

  function init() {
    if (started) return;
    started = true;

    var stored = load();
    var firstRun = !stored;
    state.data = stored || blankData();
    state.dayKey = L.dateKey(new Date());
    state.kid = 'all';
    state.view = 'today';
    state.unlocked = false; /* 새로고침하면 관리자 잠금은 다시 걸린다 */
    state.lastActivity = Date.now();
    var hash = String(window.location.hash || '').replace('#', '');
    if (TABS.some(function (t) { return t.id === hash; })) state.view = hash;
    pruneChecks();
    if (firstRun) save();

    document.addEventListener('click', handleClick);
    document.addEventListener('submit', handleSubmit);
    document.addEventListener('change', handleChange);
    document.addEventListener('keydown', handleKeydown);
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      state.installEvent = e;
      renderAll();
    });
    window.addEventListener('appinstalled', function () {
      state.installEvent = null;
      toast('홈 화면에 추가됐어요');
      renderAll();
    });

    registerSW();
    renderAll();
    if (firstRun) toast('환영해요! 아래에서 아이를 추가해 계획표를 만들어 보세요');
    window.setInterval(tick, 20000);
    setTimeout(checkNotifications, 1200);
  }

  /* 테스트/디버그용 공개 API */
  window.AcademyApp = {
    state: state,
    init: init,
    load: load,
    save: save,
    normalizeData: normalizeData,
    blankData: blankData,
    buildSampleData: buildSampleData,
    upsertKid: upsertKid,
    deleteKid: deleteKid,
    upsertClass: upsertClass,
    deleteClass: deleteClass,
    upsertRoutine: upsertRoutine,
    deleteRoutine: deleteRoutine,
    toggleRoutine: toggleRoutine,
    upsertHomework: upsertHomework,
    deleteHomework: deleteHomework,
    toggleHomework: toggleHomework,
    openSheet: openSheet,
    closeSheet: closeSheet,
    submitSheet: submitSheet,
    openItemSheet: openItemSheet,
    guardEdit: guardEdit,
    lockInfo: lockInfo,
    hasPin: hasPin,
    lockRequired: lockRequired,
    setPin: setPin,
    clearPin: clearPin,
    verifyPin: verifyPin,
    lockNow: lockNow,
    unlockSession: unlockSession,
    autoLockCheck: autoLockCheck,
    setLockAutoMin: setLockAutoMin,
    openPinSheet: openPinSheet,
    submitPin: submitPin,
    sheetPin: sheetPin,
    renderLockBtn: renderLockBtn,
    lockCard: lockCard,
    lockedCard: lockedCard,
    resetFromLockScreen: resetFromLockScreen,
    markActivity: markActivity,
    renderMain: renderMain,
    renderGrid: renderGrid,
    gridHtml: gridHtml,
    openGrid: openGrid,
    closeGrid: closeGrid,
    printGrid: printGrid,
    gridBlock: gridBlock,
    renderKidBar: renderKidBar,
    renderTabBar: renderTabBar,
    renderSheet: renderSheet,
    checklistCard: checklistCard,
    todayRoutines: todayRoutines,
    routineStats: routineStats,
    isRoutineDone: isRoutineDone,
    openHomeworksDue: openHomeworksDue,
    todayOpenCount: todayOpenCount,
    loadSamplePlan: loadSamplePlan,
    resetAll: resetAll,
    checkNotifications: checkNotifications,
    headerLine: headerLine,
    liveText: liveText,
    whenText: whenText,
    exportICS: exportICS,
    importICSFile: importICSFile,
    openIcsSheet: openIcsSheet,
    sheetICS: sheetICS,
    applyIcsImport: applyIcsImport,
    refreshIcsDuplicates: refreshIcsDuplicates,
    icsWhenText: icsWhenText,
    toast: toast,
    handleClick: handleClick,
    handleChange: handleChange,
    handleKeydown: handleKeydown,
    handleSubmit: handleSubmit
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
