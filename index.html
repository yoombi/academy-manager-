<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="아이별 학원 스케줄과 숙제를 한 곳에서 관리하는 앱">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아이별 학원">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<title>아이별 학원·숙제</title>
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <div class="brand-text">
      <h1>아이별 학원·숙제</h1>
      <p class="today-line" id="todayLine"></p>
    </div>
    <button class="icon-btn" type="button" id="lockBtn" data-action="toggle-lock" aria-label="관리자 잠금" aria-pressed="false" hidden>🔒</button>
    <button class="icon-btn" type="button" data-action="set-view" data-view="settings" aria-label="설정">⚙️</button>
  </div>
  <nav class="kidbar" id="kidBar" aria-label="아이 선택"></nav>
</header>

<main id="main" class="main"></main>

<nav class="tabbar" id="tabBar" aria-label="화면 이동"></nav>
<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<noscript><p style="padding:24px;font-size:16px">이 앱을 사용하려면 브라우저의 자바스크립트를 켜 주세요.</p></noscript>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
